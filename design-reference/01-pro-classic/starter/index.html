<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #6C7CF0;outline-offset:3px}
@keyframes cardIn{0%{opacity:0;transform:translateY(48px) rotateX(28deg) scale(.94)}100%{opacity:1;transform:none}}
@keyframes riseIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 01-pro-classic — starter — from CardThemesDark.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: 1380px; box-sizing: border-box; background: {{bg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: {{ink}}; display: flex; flex-direction: column; overflow: hidden; transition: background 350ms ease, color 350ms ease">

  <div style="position: absolute; left: 45px; top: 60px; width: 300px; height: 260px; border-radius: 50%; background: {{glow}}; filter: blur(70px); opacity: {{glowOpacity}}; pointer-events: none; transition: opacity 350ms ease"></div>

  <div style="position: relative; height: 64px; margin: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{line}}">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">[YOUR BRAND]</span>
    <div style="display: flex; align-items: center; gap: 6px">
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <div style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid {{line}}; color: {{ink}}; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          </sc-if>
          <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          </sc-if>
        </div>
      </button>
      <button type="button" onClick="{{shareCard}}" aria-label="Share this card" style="all: unset; cursor: pointer; height: 44px; display: flex; align-items: center">
        <div style="height: 36px; padding: 0 12px 0 14px; border-radius: 18px; border: 1px solid {{line}}; box-sizing: border-box; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.6px; color: {{ink}}">
          SHARE
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="m16 6-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        </div>
      </button>
    </div>
  </div>

  <div class="anim" style="position: relative; padding: 26px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 18px; perspective: 1400px; animation: cardIn 900ms cubic-bezier(.2,.8,.2,1) 120ms both">
    <button type="button" onClick="{{flip}}" onMouseMove="{{tiltMove}}" onMouseLeave="{{tiltReset}}" onTouchMove="{{tiltMove}}" onTouchEnd="{{tiltReset}}" aria-label="Flip card" style="all: unset; cursor: pointer; width: 342px; height: 206px; display: block; perspective: 1200px">
      <div style="position: relative; width: 342px; height: 206px; transform-style: preserve-3d; transition: {{cardTransition}}; transform: {{cardTransform}}">

        <div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; overflow: hidden; background: {{card}}; color: {{cardInk}}; box-shadow: {{cardShadow}}">
          <sc-if value="{{holo}}" hint-placeholder-val="{{ true }}">
            <div style="position: absolute; inset: 0; background-image: linear-gradient(115deg, transparent 18%, rgba(255,90,200,0.22) 34%, rgba(80,200,255,0.22) 46%, rgba(255,230,90,0.20) 58%, rgba(120,255,190,0.18) 68%, transparent 82%); background-size: 260% 260%; background-position: {{holoPos}}; mix-blend-mode: {{holoBlend}}; transition: background-position 120ms ease-out; pointer-events: none"></div>
          </sc-if>
          <div style="position: absolute; inset: 0; background: {{glare}}; pointer-events: none"></div>
          <div style="position: relative; height: 100%; box-sizing: border-box; padding: 22px 22px 20px; display: flex; flex-direction: column; justify-content: space-between">
            <div style="display: flex; justify-content: space-between; align-items: flex-start">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; opacity: 0.75">Freelance · Cavite, PH</span>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.8"><path d="M8.5 8.5a5 5 0 0 1 0 7"></path><path d="M12 5.5a9.5 9.5 0 0 1 0 13"></path><path d="M15.5 2.5a14 14 0 0 1 0 19"></path><circle cx="5" cy="12" r="1"></circle></svg>
            </div>
            <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 14px">
              <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
                <span style="font-size: 28px; line-height: 1.02; font-weight: 700; letter-spacing: -0.8px">Warren Jacob Abdon</span>
                <span style="font-size: 14px; font-weight: 500; opacity: 0.8">Software Engineer · Full-Stack Developer</span>
              </div>
              <div style="width: 80px; height: 80px; flex-shrink: 0; border-radius: 16px; background: {{photoBg}}; box-shadow: inset 0 0 0 1px {{photoLine}}; overflow: hidden; display: flex; align-items: flex-end; justify-content: center">
                <img src="assets/photo.jpg" alt="Portrait of Warren Jacob Abdon" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%">
              </div>
            </div>
          </div>
        </div>

        <div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); border-radius: 18px; overflow: hidden; background: {{card}}; color: {{cardInk}}; box-shadow: {{cardShadow}}">
          <div style="position: absolute; inset: 0; background: {{glare}}; pointer-events: none"></div>
          <div style="position: relative; height: 100%; box-sizing: border-box; padding: 20px; display: flex; align-items: center; gap: 20px">
            <div style="width: 150px; height: 150px; flex-shrink: 0; border-radius: 12px; background: #FFFFFF; padding: 9px; box-sizing: border-box; display: grid; grid-template-columns: {{qrCols}}">
              <sc-for list="{{qr}}" as="cell" hint-placeholder-count="441">
                <div style="aspect-ratio: 1; background: {{cell.c}}"></div>
              </sc-for>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 18px; font-weight: 700; line-height: 1.15">Scan to save me to your phone</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.4; opacity: 0.75">yourbrand.com/yourname</span>
            </div>
          </div>
        </div>
      </div>
    </button>

    <div style="height: 40px; padding: 4px; border-radius: 20px; background: {{surface}}; border: 1px solid {{line}}; box-sizing: border-box; display: flex; gap: 4px">
      <button type="button" onClick="{{showFront}}" style="all: unset; cursor: pointer; height: 30px; padding: 0 16px; border-radius: 15px; background: {{frontBg}}; color: {{frontInk}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; transition: background 200ms">Card</button>
      <button type="button" onClick="{{showBack}}" style="all: unset; cursor: pointer; height: 30px; padding: 0 16px; border-radius: 15px; background: {{backBg}}; color: {{backInk}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; transition: background 200ms">QR code</button>
    </div>
  </div>

  <div class="anim" style="position: relative; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 20px; animation: riseIn 700ms ease-out 450ms both">
    <button type="button" onClick="{{save}}" style="all: unset; cursor: pointer; box-sizing: border-box; height: 60px; border-radius: 18px; background: {{saveBg}}; color: {{saveInk}}; box-shadow: {{saveBorder}}; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 22px; font-size: 17px; font-weight: 600; transition: background 300ms, color 300ms">
      <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
        <span>Saved to contacts</span>
      </sc-if>
      <sc-if value="{{notSaved}}" hint-placeholder-val="{{ true }}">
        <span>Save Contact</span>
      </sc-if>
      <div style="width: 44px; height: 44px; border-radius: 13px; background: {{saveChip}}; color: {{saveChipInk}}; box-shadow: {{saveChipRing}}; display: flex; align-items: center; justify-content: center; transition: background 300ms">
        <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </sc-if>
        <sc-if value="{{notSaved}}" hint-placeholder-val="{{ true }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>
        </sc-if>
      </div>
    </button>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <a href="tel:+630000000000" style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: {{soft}}">
        <div style="width: 58px; height: 58px; border-radius: 29px; background: {{surface}}; border: 1px solid {{line}}; color: {{ink}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></div>
        Call
      </a>
      <a href="mailto:name@company.com" style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: {{soft}}">
        <div style="width: 58px; height: 58px; border-radius: 29px; background: {{surface}}; border: 1px solid {{line}}; color: {{ink}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg></div>
        Email
      </a>
      <a href="sms:+630000000000" style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: {{soft}}">
        <div style="width: 58px; height: 58px; border-radius: 29px; background: {{surface}}; border: 1px solid {{line}}; color: {{ink}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
        Text
      </a>
      <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Office+address" style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: {{soft}}">
        <div style="width: 58px; height: 58px; border-radius: 29px; background: {{surface}}; border: 1px solid {{line}}; color: {{ink}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></div>
        Directions
      </a>
    </div>
  </div>

  <div style="position: relative; padding: 40px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">ABOUT</span>
    <p style="margin: 0; font-size: 22px; line-height: 1.35; font-weight: 500; letter-spacing: -0.3px">I build fast, reliable web apps end to end, from the database to the interface. Got an idea? Let's build it.</p>
  </div>

  <div style="position: relative; padding: 36px 24px 0; display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">CONNECT</span>
    <a href="https://linkedin.com/in/yourname" style="min-height: 68px; border-radius: 18px; background: {{surface}}; border: 1px solid {{line}}; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 14px">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #0A66C2; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="-62.72 -30.72 573.44 573.44" fill="currentColor" role="img" aria-hidden="true"><path d="M100.3 448l-92.9 0 0-299.1 92.9 0 0 299.1zM53.8 108.1C24.1 108.1 0 83.5 0 53.8 0 39.5 5.7 25.9 15.8 15.8s23.8-15.8 38-15.8 27.9 5.7 38 15.8 15.8 23.8 15.8 38c0 29.7-24.1 54.3-53.8 54.3zM447.9 448l-92.7 0 0-145.6c0-34.7-.7-79.2-48.3-79.2-48.3 0-55.7 37.7-55.7 76.7l0 148.1-92.8 0 0-299.1 89.1 0 0 40.8 1.3 0c12.4-23.5 42.7-48.3 87.9-48.3 94 0 111.3 61.9 111.3 142.3l0 164.3-.1 0z"></path></svg></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 16px; font-weight: 600">Connect on LinkedIn</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{dim}}">linkedin.com/in/yourname</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{dim}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg>
    </a>
    <div style="min-height: 60px; border-radius: 18px; border: 1px solid {{line}}; box-sizing: border-box; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg>
      <a href="mailto:name@company.com" style="font-size: 15px; font-weight: 500; flex-grow: 1">name@company.com</a>
      <button type="button" onClick="{{copyEmail}}" aria-label="Copy email address" style="all: unset; cursor: pointer; height: 44px; padding: 0 12px; border-radius: 12px; background: {{surface}}; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{soft}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        COPY
      </button>
    </div>
  </div>

  <div style="position: relative; padding: 32px 24px 0; display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">PROFILES TO VIEW</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <a href="https://facebook.com/yourname" style="height: 104px; border-radius: 18px; background: {{surface}}; border: 1px solid {{line}}; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
        <div style="width: 34px; height: 34px; border-radius: 10px; background: #0866FF; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="-126.72 -30.72 573.44 573.44" fill="currentColor" role="img" aria-hidden="true"><path d="M80 299.3l0 212.7 116 0 0-212.7 86.5 0 18-97.8-104.5 0 0-34.6c0-51.7 20.3-71.5 72.7-71.5 16.3 0 29.4 .4 37 1.2l0-88.7C291.4 4 256.4 0 236.2 0 129.3 0 80 50.5 80 159.4l0 42.1-66 0 0 97.8 66 0z"></path></svg></div>
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 14px; font-weight: 600">Facebook</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: {{dim}}">/yourname</span>
        </div>
      </a>
      <a href="https://instagram.com/yourname" style="height: 104px; border-radius: 18px; background: {{surface}}; border: 1px solid {{line}}; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
        <div style="width: 34px; height: 34px; border-radius: 10px; background: radial-gradient(circle at 30% 107%, #FDF497 0%, #FDF497 5%, #FD5949 45%, #D6249F 60%, #285AEB 90%); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656
