<html lang="en">
<head>

<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Playfair+Display:wght@600;700;800;900&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Anton&amp;family=Work+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #6C7CF0;outline-offset:3px}
@keyframes nameUp{0%{opacity:0;transform:translateY(28px)}100%{opacity:1;transform:none}}
@keyframes riseIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
.mz-trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 02-pro-magazine — new sections — from MagazineSections.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: 4395px; box-sizing: border-box; background: {{bg}}; font-family: {{fBody}}; color: {{ink}}; display: flex; flex-direction: column; transition: background 350ms ease, color 350ms ease">

  <!-- Masthead strip: the template's own top bar, on a cropped band of the cover photo -->
  <div style="position: relative; height: 132px; background: {{photoBg}}; overflow: hidden">
    <img src="assets/photo.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.38) 100%); pointer-events: none"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; padding: 14px 20px 0; display: flex; align-items: center; justify-content: space-between; color: #FFFFFF">
      <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px">[YOUR BRAND]</span>
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
          <div style="width: 36px; height: 36px; border-radius: 18px; background: rgba(12,13,15,0.32); border: 1px solid rgba(255,255,255,0.28); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center">
            <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
            </sc-if>
            <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
            </sc-if>
          </div>
        </button>
      </div>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; top: 66px; display: flex; justify-content: space-between; gap: 12px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.6px; color: rgba(255,255,255,0.85); border-top: 1px solid rgba(255,255,255,0.35); padding-top: 8px">
      <span>ISSUE NO. 01</span>
      <span>THE STANDARD EDITION</span>
    </div>
  </div>

  <div style="padding: 28px 24px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">NEW SECTIONS — PRO MAGAZINE</span>
    <span style="font-family: {{fMono}}; font-size: 10px; letter-spacing: 1px; line-height: 1.6; color: {{faint}}">Page numbers continue after the Standard page's last block (P. 06): video P. 07, booking P. 08, interests P. 09, orgs P. 10, song P. 11.</span>
  </div>

  <!-- ============ VIDEO ============ -->
  <div style="padding: 44px 24px 0"><div style="border-top: 1px dashed {{line}}; padding-top: 8px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.2px; color: {{faint}}">VIDEO · FULL · sits after Selected Work</div></div>
  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">
      <span>VIDEO</span>
      <span style="display: flex; gap: 10px; align-items: baseline"><span style="font-size: 9px; color: {{accentText}}">ADD-ON</span><span>P. 07</span></span>
    </div>
    <a href="{{videoA.url}}" target="_blank" rel="noopener" aria-label="Watch the video on {{videoA.host}} (opens in a new tab)" style="background: {{ink}}; color: {{bg}}; padding: 20px; display: flex; align-items: center; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-width: 0">
        <span style="font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.6px; opacity: 0.7">ON FILM</span>
        <span style="font-family: {{fHead}}; font-size: 30px; line-height: 0.95; font-weight: {{headWeight}}; font-stretch: {{headStretch}}; text-transform: uppercase">Watch the video</span>
        <span style="display: flex; align-items: center; gap: 6px; min-width: 0; font-family: {{fMono}}; font-size: 11px; letter-spacing: 0.4px; opacity: 0.8">
          <span class="mz-trunc" style="min-width: 0">{{videoA.host}}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </span>
      </div>
      <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 32px; background: {{onInkChip}}; color: {{onInkChipInk}}; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" style="margin-left: 3px"><path d="M7 4.5v15l12.5-7.5z"></path></svg>
      </div>
    </a>
  </div>

  <div style="padding: 44px 24px 0"><div style="border-top: 1px dashed {{line}}; padding-top: 8px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.2px; color: {{faint}}">VIDEO · LONG / UNKNOWN HOST · host truncates</div></div>
  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">
      <span>VIDEO</span>
      <span style="display: flex; gap: 10px; align-items: baseline"><span style="font-size: 9px; color: {{accentText}}">ADD-ON</span><span>P. 07</span></span>
    </div>
    <a href="{{videoB.url}}" target="_blank" rel="noopener" aria-label="Watch the video on {{videoB.host}} (opens in a new tab)" style="background: {{ink}}; color: {{bg}}; padding: 20px; display: flex; align-items: center; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-width: 0">
        <span style="font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.6px; opacity: 0.7">ON FILM</span>
        <span style="font-family: {{fHead}}; font-size: 30px; line-height: 0.95; font-weight: {{headWeight}}; font-stretch: {{headStretch}}; text-transform: uppercase">Watch the video</span>
        <span style="display: flex; align-items: center; gap: 6px; min-width: 0; font-family: {{fMono}}; font-size: 11px; letter-spacing: 0.4px; opacity: 0.8">
          <span class="mz-trunc" style="min-width: 0">{{videoB.host}}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </span>
      </div>
      <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 32px; background: {{onInkChip}}; color: {{onInkChipInk}}; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" style="margin-left: 3px"><path d="M7 4.5v15l12.5-7.5z"></path></svg>
      </div>
    </a>
  </div>

  <!-- ============ BOOKING ============ -->
  <div style="padding: 44px 24px 0"><div style="border-top: 1px dashed {{line}}; padding-top: 8px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.2px; color: {{faint}}">BOOKING · FULL · sits after Get in Touch</div></div>
  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">
      <span>BOOK A TIME</span>
      <span style="display: flex; gap: 10px; align-items: baseline"><span style="font-size: 9px; color: {{accentText}}">ADD-ON</span><span>P. 08</span></span>
    </div>
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px">
        <span style="font-family: {{fHead}}; font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.4px">Book a time with me.</span>
        <span style="font-size: 16px; line-height: 1.4; color: {{dim}}">Pick a slot on my booking page.</span>
      </div>
      <a href="{{bookingA.url}}" target="_blank" rel="noopener" style="min-height: 84px; box-sizing: border-box; padding: 14px 16px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; gap: 14px">
        <div style="width: 54px; height: 54px; flex-shrink: 0; border-radius: 27px; background: {{onInkChip}}; color: {{onInkChipInk}}; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"></rect><path d="M16 2.5v4M8 2.5v4M3 10h18M9 15.5l2 2 4-4"></path></svg></div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="font-size: 22px; font-weight: 800; line-height: 1.15">Book an appointment</span>
          <span class="mz-trunc" style="font-family: {{fMono}}; font-size: 12px; letter-spacing: 0.4px; opacity: 0.85">{{bookingA.host}}</span>
        </div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M7 17 17 7M8 7h9v9"></path></svg>
      </a>
    </div>
  </div>

  <div style="padding: 44px 24px 0"><div style="border-top: 1px dashed {{line}}; padding-top: 8px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.2px; color: {{faint}}">BOOKING · LONG / UNKNOWN HOST · host truncates</div></div>
  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">
      <span>BOOK A TIME</span>
      <span style="display: flex; gap: 10px; align-items: baseline"><span style="font-size: 9px; color: {{accentText}}">ADD-ON</span><span>P. 08</span></span>
    </div>
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px">
        <span style="font-family: {{fHead}}; font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.4px">Book a time with me.</span>
        <span style="font-size: 16px; line-height: 1.4; color: {{dim}}">Pick a slot on my booking page.</span>
      </div>
      <a href="{{bookingB.url}}" target="_blank" rel="noopener" style="min-height: 84px; box-sizing: border-box; padding: 14px 16px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; gap: 14px">
        <div style="width: 54px; height: 54px; flex-shrink: 0; border-radius: 27px; background: {{onInkChip}}; color: {{onInkChipInk}}; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"></rect><path d="M16 2.5v4M8 2.5v4M3 10h18M9 15.5l2 2 4-4"></path></svg></div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="font-size: 22px; font-weight: 800; line-height: 1.15">Book an appointment</span>
          <span class="mz-trunc" style="font-family: {{fMono}}; font-size: 12px; letter-spacing: 0.4px; opacity: 0.85">{{bookingB.host}}</span>
        </div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M7 17 17 7M8 7h9v9"></path></svg>
      </a>
    </div>
  </div>

  <!-- ============ INTERESTS ============ -->
  <div style="padding: 44px 24px 0"><div style="border-top: 1px dashed {{line}}; padding-top: 8px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.2px; color: {{faint}}">INTERESTS · FULL (20) · sits after In Brief</div></div>
  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">
      <span>OFF THE CLOCK</span>
      <span>P. 09</span>
    </div>
    <p style="margin: 0; border-top: 1.5px solid {{ink}}; padding-top: 14px; font-size: 21px; line-height: 1.45; font-weight: 500; letter-spacing: -0.2px; overflow-wrap: anywhere">
      <sc-for list="{{interestsFull}}" as="it" hint-placeholder-count="20">
        <span style="white-space: {{it.ws}}">{{it.label}}</span><sc-if value="{{it.sep}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="font-family: {{fHead}}; font-weight: {{headWeight}}; color: {{accentText}}; padding: 0 9px">/</span> </sc-if>
      </sc-for>
    </p>
  </div>

  <div style="padding: 44px 24px 0"><div style="border-top: 1px dashed {{line}}; padding-top: 8px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.2px; color: {{faint}}">INTERESTS · SPARSE (1)</div></div>
  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">
      <span>OFF THE CLOCK</span>
      <span>P. 09</span>
    </div>
    <p style="margin: 0; border-top: 1.5px solid {{ink}}; padding-top: 14px; font-size: 21px; line-height: 1.45; font-weight: 500; letter-spacing: -0.2px; overflow-wrap: anywhere">
      <sc-for list="{{interestsSparse}}" as="it" hint-placeholder-count="1">
        <span style="white-space: {{it.ws}}">{{it.label}}</span><sc-if value="{{it.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-family: {{fHead}}; font-weight: {{headWeight}}; color: {{accentText}}; padding: 0 9px">/</span> </sc-if>
      </sc-for>
    </p>
  </div>

  <!-- ============ ORGS ============ -->
  <div style="padding: 44px 24px 0"><div style="border-top: 1px dashed {{line}}; padding-top: 8px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.2px; color: {{faint}}">ORGS · FULL (12) · sits after Experience</div></div>
  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">
      <span>AFFILIATIONS</span>
      <span>P. 10</span>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{orgsFull}}" as="o" hint-placeholder-count="12">
        <div style="padding: 14px 0; display: flex; align-items: center; gap: 14px; border-top: {{o.top}}; border-bottom: {{o.bottom}}">
          <div aria-hidden="true" style="width: 46px; height: 46px; flex-shrink: 0; box-shadow: inset 0 0 0 1.5px {{ink}}; display: flex; align-items: center; justify-content: center; font-family: {{fHead}}; font-size: 18px; font-weight: {{headWeight}}; font-stretch: {{headStretch}}; letter-spacing: 0.4px; color: {{o.badgeInk}}">{{o.initials}}</div>
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
            <span style="font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere">{{o.name}}</span>
            <sc-if value="{{o.role}}" hint-placeholder-val="{{ true }}"><span style="font-family: {{fMono}}; font-size: 11px; line-height: 1.45; color: {{dim}}; overflow-wrap: anywhere">{{o.role}}</span></sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 44px 24px 0"><div style="border-top: 1px dashed {{line}}; padding-top: 8px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.2px; color: {{faint}}">ORGS · SPARSE (1, no role)</div></div>
  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">
      <span>AFFILIATIONS</span>
      <span>P. 10</span>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{orgsSparse}}" as="o" hint-placeholder-count="1">
        <div style="padding: 14px 0; display: flex; align-items: center; gap: 14px; border-top: {{o.top}}; border-bottom: {{o.bottom}}">
          <div aria-hidden="true" style="width: 46px; height: 46px; flex-shrink: 0; box-shadow: inset 0 0 0 1.5px {{ink}}; display: flex; align-items: center; justify-content: center; font-family: {{fHead}}; font-size: 18px; font-weight: {{headWeight}}; font-stretch: {{headStretch}}; letter-spacing: 0.4px; color: {{o.badgeInk}}">{{o.initials}}</div>
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
            <span style="font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere">{{o.name}}</span>
            <sc-if value="{{o.role}}" hint-placeholder-val="{{ false }}"><span style="font-family: {{fMono}}; font-size: 11px; line-height: 1.45; color: {{dim}}; overflow-wrap: anywhere">{{o.role}}</span></sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- ============ SONG ============ -->
  <div style="padding: 44px 24px 0"><div style="border-top: 1px dashed {{line}}; padding-top: 8px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.2px; color: {{faint}}">SONG · FULL (80-char title + artist) · sits after Elsewhere</div></div>
  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: {{fMono}}; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">
      <span>SOUNDTRACK</span>
      <span>P. 11</span>
    </div>
    <a href="{{songFull.spotifyUrl}}" target="_blank" rel="noopener" style="min-height: 84px; box-sizing: border-box; padding: 16px; border: 1.5px solid {{ink}}; background: {{surface}}; display: flex; align-items: center; gap: 14px">
