<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:wght@600;700&amp;family=Source+Sans+3:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #1D4ED8;outline-offset:2px}
@keyframes cardIn{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:none}}
@keyframes zoomOut{0%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes sheen{0%,55%{background-position:120% 0}100%{background-position:-20% 0}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes sheetUp{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 04-pro-company — new sections — from CompanySections.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: {{pageMin}}; box-sizing: border-box; background: {{bg}}; font-family: {{fBody}}; color: {{ink}}; display: flex; flex-direction: column; overflow: hidden; transition: background 400ms ease, color 400ms ease">

  <div style="position: relative; background: {{stage}}; border-radius: 0 0 32px 32px; color: #FFFFFF; overflow: hidden; padding: 4px 16px 24px">
    <div aria-hidden="true" style="position: absolute; left: -120px; top: -40px; width: 300px; height: 300px; border-radius: 50%; background: {{glow}}; pointer-events: none"></div>
    <div style="position: relative; height: 52px; display: flex; align-items: center; justify-content: space-between; margin-right: -8px">
      <div style="height: 32px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 1.2px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"></path></svg>[COMPANY LOGO]</div>
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg></sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
      </button>
    </div>
    <div style="position: relative; margin-top: 18px; padding: 14px 0; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), inset 0 -1px 0 rgba(255,255,255,0.14)">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: rgba(255,255,255,0.7)">NEW SECTIONS — PRO COMPANY</span>
      <span style="font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.85)">Video, booking, interests, organizations and song, numbered 07–11 after the six existing sections.</span>
    </div>
  </div>

  <!-- ============ 07 VIDEO ============ -->
  <div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="padding: 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: {{dim}}">VIDEO · FULL · SITS AFTER SELECTED WORK</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: {{brandText}}">07</span><span style="font-family: {{fHead}}; font-size: 19px; font-weight: {{headWeight}}; letter-spacing: -0.3px; white-space: nowrap">Video</span><span style="flex-grow: 1; height: 1px; background: {{line}}"></span><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: {{brandSoft}}; display: flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: {{brandText}}">ADD-ON</span></div>
    <sc-for list="{{videoFull}}" as="v" hint-placeholder-count="1">
      <a href="{{v.url}}" aria-label="Watch video on {{v.host}}" style="position: relative; min-height: 200px; padding: 16px 12px 14px 18px; box-sizing: border-box; border-radius: 18px; background: {{deepBg}}; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; overflow: hidden; box-shadow: 0 12px 26px {{brandShadow}}, inset 0 0 0 1px rgba(255,255,255,0.1)">
        <div aria-hidden="true" style="position: absolute; right: -100px; top: -120px; width: 280px; height: 280px; border-radius: 50%; background: {{glow}}; pointer-events: none"></div>
        <div aria-hidden="true" style="position: absolute; right: -62px; bottom: -76px; opacity: 0.1"><svg width="170" height="170" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"></rect><path d="m10 9 5 3-5 3z"></path></svg></div>
        <span style="position: relative; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; opacity: 0.8">VIDEO</span>
        <span style="position: relative; align-self: center; width: 64px; height: 64px; border-radius: 32px; background: #FFFFFF; color: {{playInk}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(255,255,255,0.12), 0 12px 28px rgba(0,0,0,0.35)"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 3px"><path d="M7 4.5v15l12.5-7.5z"></path></svg></span>
        <div style="position: relative; display: flex; align-items: center; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 17px; font-weight: 700">Watch the video</span><span style="font-size: 13px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{v.host}}</span></div>
          <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg></div>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="padding: 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: {{dim}}">VIDEO · LONG / UNKNOWN HOST</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: {{brandText}}">07</span><span style="font-family: {{fHead}}; font-size: 19px; font-weight: {{headWeight}}; letter-spacing: -0.3px; white-space: nowrap">Video</span><span style="flex-grow: 1; height: 1px; background: {{line}}"></span><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: {{brandSoft}}; display: flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: {{brandText}}">ADD-ON</span></div>
    <sc-for list="{{videoLong}}" as="v" hint-placeholder-count="1">
      <a href="{{v.url}}" aria-label="Watch video on {{v.host}}" style="position: relative; min-height: 200px; padding: 16px 12px 14px 18px; box-sizing: border-box; border-radius: 18px; background: {{deepBg}}; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; overflow: hidden; box-shadow: 0 12px 26px {{brandShadow}}, inset 0 0 0 1px rgba(255,255,255,0.1)">
        <div aria-hidden="true" style="position: absolute; right: -100px; top: -120px; width: 280px; height: 280px; border-radius: 50%; background: {{glow}}; pointer-events: none"></div>
        <div aria-hidden="true" style="position: absolute; right: -62px; bottom: -76px; opacity: 0.1"><svg width="170" height="170" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"></rect><path d="m10 9 5 3-5 3z"></path></svg></div>
        <span style="position: relative; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; opacity: 0.8">VIDEO</span>
        <span style="position: relative; align-self: center; width: 64px; height: 64px; border-radius: 32px; background: #FFFFFF; color: {{playInk}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(255,255,255,0.12), 0 12px 28px rgba(0,0,0,0.35)"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 3px"><path d="M7 4.5v15l12.5-7.5z"></path></svg></span>
        <div style="position: relative; display: flex; align-items: center; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 17px; font-weight: 700">Watch the video</span><span style="font-size: 13px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{v.host}}</span></div>
          <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg></div>
        </div>
      </a>
    </sc-for>
  </div>

  <!-- ============ 08 BOOKING ============ -->
  <div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="padding: 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: {{dim}}">BOOKING · FULL · SITS AFTER GET IN TOUCH</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: {{brandText}}">08</span><span style="font-family: {{fHead}}; font-size: 19px; font-weight: {{headWeight}}; letter-spacing: -0.3px; white-space: nowrap">Book a meeting</span><span style="flex-grow: 1; height: 1px; background: {{line}}"></span><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: {{brandSoft}}; display: flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: {{brandText}}">ADD-ON</span></div>
    <sc-for list="{{bookingFull}}" as="bk" hint-placeholder-count="1">
      <div style="position: relative; padding: 18px; border-radius: 18px; background: {{surface}}; box-shadow: 0 0 0 1px {{line}}; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
        <div aria-hidden="true" style="position: absolute; right: -24px; top: -30px; color: {{brandText}}; opacity: 0.08"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></div>
        <div style="position: relative; display: flex; align-items: center; gap: 14px">
          <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: {{brandSoft}}; color: {{brandText}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"></path></svg></span>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: {{dim}}">BOOKING</span><span style="font-size: 16px; font-weight: 600">Schedule a call or visit</span><span style="font-size: 13px; color: {{dim}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{bk.host}}</span></div>
        </div>
        <a href="{{bk.url}}" style="position: relative; box-sizing: border-box; min-height: 52px; padding: 0 16px; border-radius: 14px; background: {{brand}}; color: {{onBrand}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600; box-shadow: {{brandBtnShadow}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Open booking page<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
      </div>
    </sc-for>
  </div>

  <div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="padding: 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: {{dim}}">BOOKING · LONG / UNKNOWN HOST</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: {{brandText}}">08</span><span style="font-family: {{fHead}}; font-size: 19px; font-weight: {{headWeight}}; letter-spacing: -0.3px; white-space: nowrap">Book a meeting</span><span style="flex-grow: 1; height: 1px; background: {{line}}"></span><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: {{brandSoft}}; display: flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: {{brandText}}">ADD-ON</span></div>
    <sc-for list="{{bookingLong}}" as="bk" hint-placeholder-count="1">
      <div style="position: relative; padding: 18px; border-radius: 18px; background: {{surface}}; box-shadow: 0 0 0 1px {{line}}; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
        <div aria-hidden="true" style="position: absolute; right: -24px; top: -30px; color: {{brandText}}; opacity: 0.08"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></div>
        <div style="position: relative; display: flex; align-items: center; gap: 14px">
          <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: {{brandSoft}}; color: {{brandText}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"></path></svg></span>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: {{dim}}">BOOKING</span><span style="font-size: 16px; font-weight: 600">Schedule a call or visit</span><span style="font-size: 13px; color: {{dim}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{bk.host}}</span></div>
        </div>
        <a href="{{bk.url}}" style="position: relative; box-sizing: border-box; min-height: 52px; padding: 0 16px; border-radius: 14px; background: {{brand}}; color: {{onBrand}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600; box-shadow: {{brandBtnShadow}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Open booking page<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
      </div>
    </sc-for>
  </div>

  <!-- ============ 09 INTERESTS ============ -->
  <div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="padding: 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: {{dim}}">INTERESTS · FULL (20) · SITS AFTER ABOUT OR SKILLS</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: {{brandText}}">09</span><span style="font-family: {{fHead}}; font-size: 19px; font-weight: {{headWeight}}; letter-spacing: -0.3px; white-space: nowrap">Interests</span><span style="flex-grow: 1; height: 1px; background: {{line}}"></span></div>
    <div style="border-radius: 18px; background: {{surface}}; box-shadow: 0 0 0 1px {{line}}; padding: 18px; display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{interestsFull}}" as="it" hint-placeholder-count="20"><span style="box-sizing: border-box; max-width: 100%; min-height: 32px; padding: 6px 12px 6px 10px; border-radius: 8px; background: {{bg}}; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.35; font-weight: 500; color: {{soft}}; overflow-wrap: anywhere"><span style="width: 6px; height: 6px; flex-shrink: 0; border-radius: 3px; background: {{brandText}}"></span>{{it.label}}</span></sc-for>
    </div>
  </div>

  <div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="padding: 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: {{dim}}">INTERESTS · SPARSE</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: {{brandText}}">09</span><span style="font-family: {{fHead}}; font-size: 19px; font-weight: {{headWeight}}; letter-spacing: -0.3px; white-space: nowrap">Interests</span><span style="flex-grow: 1; height: 1px; background: {{line}}"></span></div>
    <div style="border-radius: 18px; background: {{surface}}; box-shadow: 0 0 0 1px {{line}}; padding: 18px; display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{interestsSparse}}" as="it" hint-placeholder-count="1"><span style="box-sizing: border-box; max-width: 100%; min-height: 32px; padding: 6px 12px 6px 10px; border-radius: 8px; background: {{bg}}; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.35; font-weight: 500; color: {{soft}}; overflow-wrap: anywhere"><span style="width: 6px; height: 6px; flex-shrink: 0; border-radius: 3px; background: {{brandText}}"></span>{{it.label}}</span></sc-for>
    </div>
  </div>

  <!-- ============ 10 ORGANIZATIONS ============ -->
  <div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="padding: 0 4px; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: {{dim}}">ORGS · FULL (12) · SITS AFTER EXPERIENCE</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: {{brandText}}">10</span><span style="font-family: {{fHead}}; font-size: 19px; font-weight: {{headWeight}}; letter-spacing: -0.3px; white-space: nowrap">Organizations</span><span style="flex-grow: 1; height: 1px; background: {{line}}"></span></div>
    <div style="border-radius: 18px; background: {{surface}}; box-shadow: 0 0 0 1px {{line}}; padding: 8px 18px; display: flex; flex-direction: column">
      <sc-for list="{{orgsFull}}" as="o" hint-placeholder-count="12">
        <div style="padding: 10px 0; display: flex; align-items: center; gap: 12px; box-shadow: {{o.divider}}"><span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: {{brandSoft}}; color: {{brandText}}; display: flex; align-items: center; justify-content: center; font-family: {{fHead}}; font-size: 15px; font-weight: {{headWeight}}; letter-spacing: 0.4px">{{o.initials}}</span><div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere">{{o.name}}</span><sc-if value="{{o.hasRole}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; line-height: 1.35; color: {{dim}}">{{o.role}}</span></sc-if></div></div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 12px">
