<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Mono:wght@400;500&amp;family=Caveat:wght@600&amp;family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=Manrope:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Syne:wght@600;700;800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #6C7CF0;outline-offset:3px}
@keyframes handOver{0%{opacity:0;transform:translateY(60px) rotate(-7deg) scale(.96)}60%{opacity:1;transform:translateY(-6px) rotate(1.5deg)}100%{opacity:1;transform:none}}
@keyframes riseIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes inkIn{0%{opacity:0;clip-path:inset(0 100% 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 03-pro-signature — new sections — from SignatureSections.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: 4016px; box-sizing: border-box; background: {{bg}}; font-family: {{fBody}}; color: {{ink}}; display: flex; flex-direction: column; overflow: hidden; transition: background 350ms ease, color 350ms ease">

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 460px; background: {{wash}}; pointer-events: none"></div>

  <div style="position: relative; height: 64px; padding: 0 12px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center">
    <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <div style="width: 36px; height: 36px; border-radius: 18px; background: {{surface}}; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        </sc-if>
      </div>
    </button>
    <span style="text-align: center; font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">[YOUR BRAND]</span>
    <button type="button" onClick="{{shareCard}}" aria-label="Share this card" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <div style="width: 36px; height: 36px; border-radius: 18px; background: {{surface}}; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="m16 6-4-4-4 4"></path><path d="M12 2v13"></path></svg>
      </div>
    </button>
  </div>

  <div style="position: relative; padding: 18px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
    <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">NEW SECTIONS — PRO SIGNATURE</span>
    <span style="font-family: 'Caveat', cursive; font-size: 30px; line-height: 1; color: {{ink}}; transform: rotate(-3deg); display: inline-block">video, booking, interests, orgs, song</span>
    <div style="width: 120px; height: 1.5px; background: {{line}}"></div>
  </div>

  <!-- ============ VIDEO ============ -->
  <div style="position: relative; padding: 40px 24px 0; display: flex; align-items: center; gap: 10px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; color: {{faint}}">
    <span style="min-width: 0">VIDEO · sits after Portfolio</span>
    <div style="flex: 1 0 24px; border-top: 1px dashed {{line}}"></div>
  </div>
  <sc-for list="{{videoMain}}" as="v" hint-placeholder-count="1">
    <div style="position: relative; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
        <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">VIDEO</span>
        <span style="height: 18px; padding: 0 7px; border-radius: 9px; background: {{accentSoft}}; color: {{accentAA}}; display: flex; align-items: center; font-family: {{fMono}}; font-size: 9px; letter-spacing: 1px">ADD-ON</span>
      </div>
      <a href="{{v.url}}" aria-label="Watch the video on {{v.host}}" style="position: relative; display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 16 / 10; min-height: 0; box-sizing: border-box; padding: 16px 18px 18px; border-radius: 24px; overflow: hidden; background-color: {{card}}; background-image: radial-gradient({{dotGrid}} 1px, transparent 1.3px); background-size: 14px 14px; color: {{cardInk}}; box-shadow: {{cardShadowSoft}}">
        <div style="display: flex; justify-content: space-between; align-items: center; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; opacity: 0.7">
          <span>VIDEO</span>
          <span>TAP TO WATCH ↗</span>
        </div>
        <div style="align-self: center; margin: 14px 0; width: 68px; height: 68px; flex-shrink: 0; border-radius: 34px; background: {{playBg}}; color: {{playInk}}; box-shadow: {{playRing}}; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" style="margin-left: 3px"><path d="M7 4.8v14.4L19 12z"></path></svg>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
            <span style="font-family: {{fHead}}; font-size: 20px; line-height: 1.1; font-weight: 800; letter-spacing: -0.3px">Watch the video</span>
            <span style="font-family: {{fMono}}; font-size: 11px; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.host}}</span>
          </div>
        </div>
      </a>
    </div>
  </sc-for>

  <div style="position: relative; padding: 32px 24px 0; display: flex; align-items: center; gap: 10px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; color: {{faint}}">
    <span style="min-width: 0">VIDEO · LONG HOST · truncates</span>
    <div style="flex: 1 0 24px; border-top: 1px dashed {{line}}"></div>
  </div>
  <sc-for list="{{videoLong}}" as="v" hint-placeholder-count="1">
    <div style="position: relative; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
        <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">VIDEO</span>
        <span style="height: 18px; padding: 0 7px; border-radius: 9px; background: {{accentSoft}}; color: {{accentAA}}; display: flex; align-items: center; font-family: {{fMono}}; font-size: 9px; letter-spacing: 1px">ADD-ON</span>
      </div>
      <a href="{{v.url}}" aria-label="Watch the video on {{v.host}}" style="position: relative; display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 16 / 10; min-height: 0; box-sizing: border-box; padding: 16px 18px 18px; border-radius: 24px; overflow: hidden; background-color: {{card}}; background-image: radial-gradient({{dotGrid}} 1px, transparent 1.3px); background-size: 14px 14px; color: {{cardInk}}; box-shadow: {{cardShadowSoft}}">
        <div style="display: flex; justify-content: space-between; align-items: center; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; opacity: 0.7">
          <span>VIDEO</span>
          <span>TAP TO WATCH ↗</span>
        </div>
        <div style="align-self: center; margin: 14px 0; width: 68px; height: 68px; flex-shrink: 0; border-radius: 34px; background: {{playBg}}; color: {{playInk}}; box-shadow: {{playRing}}; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" style="margin-left: 3px"><path d="M7 4.8v14.4L19 12z"></path></svg>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
            <span style="font-family: {{fHead}}; font-size: 20px; line-height: 1.1; font-weight: 800; letter-spacing: -0.3px">Watch the video</span>
            <span style="font-family: {{fMono}}; font-size: 11px; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.host}}</span>
          </div>
        </div>
      </a>
    </div>
  </sc-for>

  <!-- ============ BOOKING ============ -->
  <div style="position: relative; padding: 48px 24px 0; display: flex; align-items: center; gap: 10px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; color: {{faint}}">
    <span style="min-width: 0">BOOKING · sits after Connect</span>
    <div style="flex: 1 0 24px; border-top: 1px dashed {{line}}"></div>
  </div>
  <sc-for list="{{bookingMain}}" as="b" hint-placeholder-count="1">
    <div style="position: relative; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
        <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">BOOK A MEETING</span>
        <span style="height: 18px; padding: 0 7px; border-radius: 9px; background: {{accentSoft}}; color: {{accentAA}}; display: flex; align-items: center; font-family: {{fMono}}; font-size: 9px; letter-spacing: 1px">ADD-ON</span>
      </div>
      <a href="{{b.url}}" style="border-radius: 22px; background: {{surface}}; box-shadow: inset 0 0 0 1px {{line}}; padding: 16px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 14px; padding: 0 2px">
          <div style="width: 44px; height: 44px; border-radius: 22px; background: {{accentSoft}}; color: {{accentAA}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8.5 15l2.5 2.5 4.5-4.5"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-family: {{fHead}}; font-size: 16px; font-weight: 700">Book an appointment</span>
            <span style="font-family: {{fMono}}; font-size: 11px; color: {{dim}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.host}}</span>
          </div>
        </div>
        <div style="height: 52px; border-radius: 26px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700">
          Open booking page
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </div>
      </a>
    </div>
  </sc-for>

  <div style="position: relative; padding: 32px 24px 0; display: flex; align-items: center; gap: 10px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; color: {{faint}}">
    <span style="min-width: 0">BOOKING · LONG HOST · truncates</span>
    <div style="flex: 1 0 24px; border-top: 1px dashed {{line}}"></div>
  </div>
  <sc-for list="{{bookingLong}}" as="b" hint-placeholder-count="1">
    <div style="position: relative; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
        <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">BOOK A MEETING</span>
        <span style="height: 18px; padding: 0 7px; border-radius: 9px; background: {{accentSoft}}; color: {{accentAA}}; display: flex; align-items: center; font-family: {{fMono}}; font-size: 9px; letter-spacing: 1px">ADD-ON</span>
      </div>
      <a href="{{b.url}}" style="border-radius: 22px; background: {{surface}}; box-shadow: inset 0 0 0 1px {{line}}; padding: 16px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 14px; padding: 0 2px">
          <div style="width: 44px; height: 44px; border-radius: 22px; background: {{accentSoft}}; color: {{accentAA}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8.5 15l2.5 2.5 4.5-4.5"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-family: {{fHead}}; font-size: 16px; font-weight: 700">Book an appointment</span>
            <span style="font-family: {{fMono}}; font-size: 11px; color: {{dim}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.host}}</span>
          </div>
        </div>
        <div style="height: 52px; border-radius: 26px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700">
          Open booking page
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </div>
      </a>
    </div>
  </sc-for>

  <!-- ============ INTERESTS ============ -->
  <div style="position: relative; padding: 48px 24px 0; display: flex; align-items: center; gap: 10px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; color: {{faint}}">
    <span style="min-width: 0">INTERESTS · FULL · sits after Skills</span>
    <div style="flex: 1 0 24px; border-top: 1px dashed {{line}}"></div>
  </div>
  <div style="position: relative; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">INTERESTS</span>
    </div>
    <div style="margin: 0 -20px; padding: 14px 24px; border-top: 1px solid {{line}}; border-bottom: 1px solid {{line}}; display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; row-gap: 10px; font-family: {{fMono}}; font-size: 12px; line-height: 1.5; letter-spacing: 1.6px; text-transform: uppercase; color: {{soft}}">
      <sc-for list="{{interestsFull}}" as="it" hint-placeholder-count="20">
        <span style="display: block; max-width: 100%; min-width: 0; overflow-wrap: anywhere">{{it.label}}<span style="display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: {{dotC}}; margin: 0 0 1px 16px; vertical-align: middle"></span></span>
      </sc-for>
    </div>
  </div>

  <div style="position: relative; padding: 32px 24px 0; display: flex; align-items: center; gap: 10px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; color: {{faint}}">
    <span style="min-width: 0">INTERESTS · SPARSE</span>
    <div style="flex: 1 0 24px; border-top: 1px dashed {{line}}"></div>
  </div>
  <div style="position: relative; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">INTERESTS</span>
    </div>
    <div style="margin: 0 -20px; padding: 14px 24px; border-top: 1px solid {{line}}; border-bottom: 1px solid {{line}}; display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; row-gap: 10px; font-family: {{fMono}}; font-size: 12px; line-height: 1.5; letter-spacing: 1.6px; text-transform: uppercase; color: {{soft}}">
      <sc-for list="{{interestsSparse}}" as="it" hint-placeholder-count="1">
        <span style="display: block; max-width: 100%; min-width: 0; overflow-wrap: anywhere">{{it.label}}<span style="display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: {{dotC}}; margin: 0 0 1px 16px; vertical-align: middle"></span></span>
      </sc-for>
    </div>
  </div>

  <!-- ============ ORGS ============ -->
  <div style="position: relative; padding: 48px 24px 0; display: flex; align-items: center; gap: 10px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; color: {{faint}}">
    <span style="min-width: 0">ORGS · FULL · sits after Experience</span>
    <div style="flex: 1 0 24px; border-top: 1px dashed {{line}}"></div>
  </div>
  <div style="position: relative; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">ORGANIZATIONS</span>
    </div>
    <div style="border-radius: 22px; background: {{surface}}; box-shadow: inset 0 0 0 1px {{line}}; overflow: hidden">
      <sc-for list="{{orgsFull}}" as="o" hint-placeholder-count="12">
        <div style="min-height: 68px; padding: 12px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; box-shadow: {{o.divider}}">
          <div style="width: 40px; height: 40px; border-radius: 20px; background: {{accentSoft}}; color: {{accentAA}}; display: flex; align-items: center; justify-content: center; font-family: {{fMono}}; font-size: 12px; letter-spacing: 0.5px; flex-shrink: 0">{{o.initials}}</div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-family: {{fHead}}; font-size: 16px; line-height: 1.3; font-weight: 700; overflow-wrap: anywhere">{{o.name}}</span>
            <sc-if value="{{o.hasRole}}" hint-placeholder-val="{{ true }}">
              <span style="font-size: 13px; line-height: 1.35; color: {{dim}}; overflow-wrap: anywhere">{{o.role}}</span>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: relative; padding: 32px 24px 0; display: flex; align-items: center; gap: 10px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; color: {{faint}}">
    <span style="min-width: 0">ORGS · SPARSE · no role</span>
    <div style="flex: 1 0 24px; border-top: 1px dashed {{line}}"></div>
  </div>
  <div style="position: relative; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <span style="font-family: {{fMono}}; font-size: 11px; letter-spacing: 2px; color: {{muted}}">ORGANIZATIONS</span>
    </div>
    <div style="border-radius: 22px; background: {{surface}}; box-shadow: inset 0 0 0 1px {{line}}; overflow: hidden">
      <sc-for list="{{orgsSparse}}" as="o" hint-placeholder-count="1">
        <div style="min-height: 68px; padding: 12px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; box-shadow: {{o.divider}}">
          <div style="width: 40px; height: 40px; border-radius: 20px; background: {{accentSoft}}; color: {{accentAA}}; display: flex; align-items: center; justify-content: center; font-family: {{fMono}}; font-size: 12px; letter-spacing: 0.5px; flex-shrink: 0">{{o.initials}}</div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-family: {{fHead}}; font-size: 16px; line-height: 1.3; font-weight: 700; overflow-wrap: anywhere">{{o.name}}</span>
            <sc-if value="{{o.hasRole}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 13px; line-height: 1.35; color: {{dim}}; overflow-wrap: anywhere">{{o.role}}</span>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- ============ SONG ============ -->
  <div style="position: relative; padding: 48px 24px 0; display: flex; align-items: center; gap: 10px; font-family: {{fMono}}; font-size: 10px; letter-spacing: 1.4px; color: {{faint}}">
    <span style="min-width: 0">SONG · FULL · sits after About</span>
    <div style="flex: 1 0 24px; border-top: 1px dashed {{line}}"></div>
  </div>
  <sc-for list="{{songFull}}" as="sg" hint-placeholder-count="1">
