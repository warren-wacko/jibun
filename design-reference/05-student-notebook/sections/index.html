<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&amp;family=Caveat:wght@500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #6C7CF0;outline-offset:3px}
@keyframes dropIn{0%{opacity:0;transform:translateY(-40px) rotate(-12deg)}70%{opacity:1;transform:translateY(4px) rotate(-2deg)}100%{opacity:1;transform:rotate(-3deg)}}
@keyframes stickIn{0%{opacity:0;transform:scale(.6) rotate(12deg)}100%{opacity:1;transform:rotate(4deg)}}
@keyframes markIn{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes riseIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width: 360px){.statv{font-size:25px !important}}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 05-student-notebook — new sections — from NotebookSections.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: 8440px; box-sizing: border-box; background-color: {{bg}}; background-image: linear-gradient({{grid}} 1px, transparent 1px), linear-gradient(90deg, {{grid}} 1px, transparent 1px); background-size: 24px 24px; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: {{ink}}; display: flex; flex-direction: column; overflow: hidden; transition: background-color 350ms ease, color 350ms ease">

  <div style="position: relative; height: 64px; margin: 0 20px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1.6px; color: {{muted}}">[YOUR BRAND]</span>
    <div style="display: flex; align-items: center; gap: 4px">
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: {{surface}}; box-shadow: 2px 2px 0 {{ink}}, inset 0 0 0 1.5px {{ink}}; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          </sc-if>
          <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          </sc-if>
        </div>
      </button>
      <button type="button" onClick="{{shareCard}}" aria-label="Share this card" style="all: unset; cursor: pointer; height: 44px; display: flex; align-items: center">
        <div style="height: 36px; padding: 0 12px; border-radius: 10px; background: {{surface}}; box-shadow: 2px 2px 0 {{ink}}, inset 0 0 0 1.5px {{ink}}; display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 1.4px">
          SHARE
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="m16 6-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        </div>
      </button>
    </div>
  </div>

  <div style="padding: 8px 22px 0; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.6px; color: {{muted}}">NEW SECTIONS — STUDENT NOTEBOOK</span>
    <span style="font-family: 'Caveat', cursive; font-size: 20px; color: {{muted}}">8 add-ons, full and sparse, in page order</span>
  </div>

  <!-- ===================== VIDEO ===================== -->
  <div style="padding: 30px 22px 0; display: flex; align-items: center; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.6px; line-height: 1.6; color: {{muted}}; min-width: 0">VIDEO · FULL · sits after Projects</span>
    <span style="flex: 1 0 16px; height: 0; border-top: 1.5px dashed {{line}}"></span>
  </div>
  <div style="padding: 18px 22px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.6px">Video</span>
      <span style="font-family: 'Caveat', cursive; font-size: 20px; color: {{muted}}">tap to watch</span>
    </div>
    <div style="position: relative; padding-top: 10px">
      <a href="{{videoMain.url}}" aria-label="{{videoMain.aria}}" style="display: flex; flex-direction: column; border-radius: 6px; background: {{paper}}; box-shadow: 3px 3px 0 {{shadowInk}}, inset 0 0 0 1.5px {{ink}}; padding: 12px 12px 0; transform: rotate(-0.8deg)">
        <div style="position: relative; aspect-ratio: 16 / 9; border-radius: 3px; background-color: {{tagBg}}; background-image: linear-gradient({{rule}} 1px, transparent 1px), linear-gradient(90deg, {{rule}} 1px, transparent 1px); background-size: 18px 18px; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; justify-content: center">
          <div style="width: 64px; height: 64px; border-radius: 32px; background: {{accent}}; color: {{accentInk}}; box-shadow: 3px 3px 0 {{shadowInk}}, inset 0 0 0 1.5px {{ink}}; display: flex; align-items: center; justify-content: center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
          </div>
        </div>
        <div style="min-height: 58px; display: flex; align-items: center; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{muted}}">VIDEO</span>
            <span style="font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Watch on {{videoMain.host}}</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </div>
      </a>
      <div style="position: absolute; left: 50%; top: 0; width: 82px; height: 24px; margin-left: -41px; background: {{tape}}; opacity: 0.85; transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,0.1); pointer-events: none"></div>
    </div>
  </div>

  <div style="padding: 34px 22px 0; display: flex; align-items: center; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.6px; line-height: 1.6; color: {{muted}}; min-width: 0">VIDEO · LONG / UNKNOWN HOST</span>
    <span style="flex: 1 0 16px; height: 0; border-top: 1.5px dashed {{line}}"></span>
  </div>
  <div style="padding: 18px 22px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.6px">Video</span>
      <span style="font-family: 'Caveat', cursive; font-size: 20px; color: {{muted}}">tap to watch</span>
    </div>
    <div style="position: relative; padding-top: 10px">
      <a href="{{videoLong.url}}" aria-label="{{videoLong.aria}}" style="display: flex; flex-direction: column; border-radius: 6px; background: {{paper}}; box-shadow: 3px 3px 0 {{shadowInk}}, inset 0 0 0 1.5px {{ink}}; padding: 12px 12px 0; transform: rotate(-0.8deg)">
        <div style="position: relative; aspect-ratio: 16 / 9; border-radius: 3px; background-color: {{tagBg}}; background-image: linear-gradient({{rule}} 1px, transparent 1px), linear-gradient(90deg, {{rule}} 1px, transparent 1px); background-size: 18px 18px; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; justify-content: center">
          <div style="width: 64px; height: 64px; border-radius: 32px; background: {{accent}}; color: {{accentInk}}; box-shadow: 3px 3px 0 {{shadowInk}}, inset 0 0 0 1.5px {{ink}}; display: flex; align-items: center; justify-content: center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
          </div>
        </div>
        <div style="min-height: 58px; display: flex; align-items: center; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{muted}}">VIDEO</span>
            <span style="font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Watch on {{videoLong.host}}</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </div>
      </a>
      <div style="position: absolute; left: 50%; top: 0; width: 82px; height: 24px; margin-left: -41px; background: {{tape}}; opacity: 0.85; transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,0.1); pointer-events: none"></div>
    </div>
  </div>

  <!-- ===================== BOOKING ===================== -->
  <div style="padding: 38px 22px 0; display: flex; align-items: center; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.6px; line-height: 1.6; color: {{muted}}; min-width: 0">BOOKING · FULL · sits before Find me online</span>
    <span style="flex: 1 0 16px; height: 0; border-top: 1.5px dashed {{line}}"></span>
  </div>
  <div style="padding: 18px 22px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.6px">Book a chat</span>
      <span style="font-family: 'Caveat', cursive; font-size: 20px; color: {{muted}}">opens my calendar</span>
    </div>
    <a href="{{bookMain.url}}" style="min-height: 72px; border-radius: 14px; background: {{surface}}; box-shadow: 3px 3px 0 {{shadowInk}}, inset 0 0 0 1.5px {{ink}}; padding: 12px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 12px">
      <div style="width: 42px; height: 42px; border-radius: 10px; background: {{accent}}; color: {{accentInk}}; box-shadow: inset 0 0 0 1.5px {{ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"></rect><path d="M16 2.5v4M8 2.5v4M3 10h18M8.5 15l2.5 2.5 4.5-4.5"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
        <span style="font-size: 16px; font-weight: 800">Book a time with me</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{dim}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{bookMain.host}}</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
    </a>
  </div>

  <div style="padding: 34px 22px 0; display: flex; align-items: center; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.6px; line-height: 1.6; color: {{muted}}; min-width: 0">BOOKING · LONG / UNKNOWN HOST</span>
    <span style="flex: 1 0 16px; height: 0; border-top: 1.5px dashed {{line}}"></span>
  </div>
  <div style="padding: 18px 22px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.6px">Book a chat</span>
      <span style="font-family: 'Caveat', cursive; font-size: 20px; color: {{muted}}">opens my calendar</span>
    </div>
    <a href="{{bookLong.url}}" style="min-height: 72px; border-radius: 14px; background: {{surface}}; box-shadow: 3px 3px 0 {{shadowInk}}, inset 0 0 0 1.5px {{ink}}; padding: 12px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 12px">
      <div style="width: 42px; height: 42px; border-radius: 10px; background: {{accent}}; color: {{accentInk}}; box-shadow: inset 0 0 0 1.5px {{ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"></rect><path d="M16 2.5v4M8 2.5v4M3 10h18M8.5 15l2.5 2.5 4.5-4.5"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
        <span style="font-size: 16px; font-weight: 800">Book a time with me</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{dim}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{bookLong.host}}</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
    </a>
  </div>

  <!-- ===================== GALLERY ===================== -->
  <div style="padding: 38px 22px 0; display: flex; align-items: center; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.6px; line-height: 1.6; color: {{muted}}; min-width: 0">GALLERY · FULL (10) · sits after Projects</span>
    <span style="flex: 1 0 16px; height: 0; border-top: 1.5px dashed {{line}}"></span>
  </div>
  <div style="padding: 18px 0 0; display: flex; flex-direction: column; gap: 4px">
    <div style="padding: 0 22px; display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.6px">Gallery</span>
      <span style="font-family: 'Caveat', cursive; font-size: 20px; color: {{muted}}">swipe →</span>
    </div>
    <div style="display: flex; gap: 16px; overflow-x: auto; padding: 22px 22px 22px; scroll-snap-type: x mandatory; scroll-padding: 0 22px">
      <sc-for list="{{galleryFull}}" as="g" hint-placeholder-count="10">
        <figure style="position: relative; flex: 0 0 176px; margin: 0; scroll-snap-align: start; transform: {{g.tilt}}">
          <div style="background: #FFFFFF; padding: 10px 10px 0; box-shadow: 0 10px 20px rgba(0,0,0,0.18), 0 1px 2px rgba(0,0,0,0.15)">
            <div style="aspect-ratio: 1; overflow: hidden; background: {{g.ph}}">
              <sc-if value="{{g.hasImg}}" hint-placeholder-val="{{ true }}">
                <img src="{{g.url}}" alt="{{g.alt}}" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block">
              </sc-if>
              <sc-if value="{{g.noImg}}" hint-placeholder-val="{{ false }}">
                <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: {{g.phInk}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="m21 16-5-5-9 9"></path></svg></div>
              </sc-if>
            </div>
            <figcaption aria-hidden="true" style="min-height: 46px; padding: 6px 2px 10px; font-family: 'Caveat', cursive; font-size: 19px; line-height: 1.05; font-weight: 700; color: #1E2228"><span class="clamp3">{{g.alt}}</span></figcaption>
          </div>
          <div style="position: absolute; left: 50%; top: -12px; width: 64px; height: 22px; margin-left: -32px; background: {{tape}}; opacity: 0.85; transform: {{g.tapeTilt}}; box-shadow: 0 1px 2px rgba(0,0,0,0.1)"></div>
        </figure>
      </sc-for>
    </div>
  </div>

  <div style="padding: 16px 22px 0; display: flex; align-items: center; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.6px; line-height: 1.6; color: {{muted}}; min-width: 0">GALLERY · SPARSE (1)</span>
    <span style="flex: 1 0 16px; height: 0; border-top: 1.5px dashed {{line}}"></span>
  </div>
  <div style="padding: 18px 22px 0; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.6px">Gallery</span>
    <div style="padding: 24px 0 8px 8px">
      <sc-for list="{{gallerySparse}}" as="g" hint-placeholder-count="1">
        <figure style="position: relative; width: 210px; max-width: 70%; margin: 0; transform: rotate(-2deg)">
          <div style="background: #FFFFFF; padding: 11px 11px 0; box-shadow: 0 10px 20px rgba(0,0,0,0.18), 0 1px 2px rgba(0,0,0,0.15)">
            <div style="aspect-ratio: 1; overflow: hidden; background: {{g.ph}}">
              <sc-if value="{{g.hasImg}}" hint-placeholder-val="{{ true }}">
                <img src="{{g.url}}" alt="{{g.alt}}" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block">
              </sc-if>
              <sc-if value="{{g.noImg}}" hint-placeholder-val="{{ false }}">
                <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: {{g.phInk}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="m21 16-5-5-9 9"></path></svg></div>
              </sc-if>
            </div>
            <figcaption aria-hidden="true" style="padding: 8px 2px 12px; font-family: 'Caveat', cursive; font-size: 21px; line-height: 1.05; font-weight: 700; color: #1E2228"><span class="clamp3">{{g.alt}}</span></figcaption>
          </div>
          <div style="position: absolute; left: 50%; top: -12px; width: 72px; height: 24px; margin-left: -36px; background: {{tape}}; opacity: 0.85; transform: rotate(4deg); box-shadow: 0 1px 2px rgba(0,0,0,0.1)"></div>
        </figure>
      </sc-for>
    </div>
  </div>

  <!-- ===================== SERVICES ===================== -->
  <div style="padding: 34px 22px 0; display: flex; align-items: center; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.6px; line-height: 1.6; color: {{muted}}; min-width: 0">SERVICES · FULL (20) · sits after Skills</span>
    <span style="flex: 1 0 16px; height: 0; border-top: 1.5px dashed {{line}}"></span>
  </div>
  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="padding: 0 2px; font-size: 24px; font-weight: 900; letter-spacing: -0.6px">Services</span>
    <div style="position: relative; border-radius: 6px; background: {{paper}}; box-shadow: 0 8px 20px rgba(0,0,0,0.10), inset 0 0 0 1px {{line}}; padding: 6px 16px 6px 44px">
      <div style="position: absolute; left: 30px; top: 0; bottom: 0; width: 1.5px; background: {{margin}}"></div>
      <sc-for list="{{servicesFull}}" as="sv" hint-placeholder-count="20">
        <div style="min-height: 46px; padding: 9px 0; box-sizing: border-box; display: flex; align-items: center; gap: 12px; box-shadow: {{sv.divider}}">
          <span style="flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.3">{{sv.name}}</span>
          <sc-if value="{{sv.price}}" hint-placeholder-val="{{ true }}">
            <span style="flex: 0 1 auto; max-width: 46%; text-align: right; font-size: 14px; font-weight: 800; line-height: 1.35"><span style="background-image: linear-gradient(transparent 52%, {{mark}} 52%); -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 3px">{{sv.price}}</span></span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 34px 22px 0; display: flex; align-items: center; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.6px; line-height: 1.6; color: {{muted}}; min-width: 0">SERVICES · SPARSE (1, no price)</span>
    <span style="flex: 1 0 16px; height: 0; border-top: 1.5px dashed {{line}}"></span>
  </div>
