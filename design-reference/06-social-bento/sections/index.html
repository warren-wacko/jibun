<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #2F54EB;outline-offset:3px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes tileIn{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sheetUp{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 06-social-bento — new sections — from BentoSections.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: 8645px; box-sizing: border-box; background: {{bg}}; font-family: 'Space Grotesk', system-ui, sans-serif; color: {{ink}}; display: flex; flex-direction: column; overflow: hidden; padding: 0 12px; transition: background 400ms ease, color 400ms ease">

  <div style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 4px">
    <span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1.4px; color: {{dim}}">[YOUR BRAND]</span>
    <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 18px; background: {{tile}}; color: {{ink}}; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
      </sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </sc-if>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 28px">
  <div style="padding: 4px 4px 0; display: flex; flex-direction: column; gap: 2px">
    <span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1.4px; color: {{dim}}">New sections — Social Bento</span>
    <span style="font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; font-size: 24px; color: {{soft}}">same grid, same tiles</span>
  </div>

  <div style="padding: 18px 4px 2px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: {{dim}}">VIDEO · FULL · sits after the song record</div>
  <a href="{{videoMain.url}}" aria-label="Watch my video on {{videoMain.host}}" style="position: relative; height: 178px; border-radius: 26px; background: #111111; color: #FFFFFF; box-shadow: {{tkBorder}}; padding: 16px 16px 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden">
    <svg width="170" height="170" viewBox="0 0 24 24" style="position: absolute; right: -34px; bottom: -40px" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="rgba(255,255,255,0.07)"></path></svg>
    <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.68); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{videoMain.host}}</span>
      <span style="color: rgba(255,255,255,0.68); flex-shrink: 0; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></span>
    </div>
    <div style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.68)">press play</span>
        <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.8px; line-height: 1">watch my video</span>
      </div>
      <span style="width: 64px; height: 64px; border-radius: 32px; background: {{accent}}; color: {{accentInk}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"></path></svg></span>
    </div>
  </a>
  <div style="padding: 18px 4px 2px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: {{dim}}">VIDEO · LONG / UNKNOWN HOST</div>
  <a href="{{videoLong.url}}" aria-label="Watch my video on {{videoLong.host}}" style="position: relative; height: 178px; border-radius: 26px; background: #111111; color: #FFFFFF; box-shadow: {{tkBorder}}; padding: 16px 16px 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden">
    <svg width="170" height="170" viewBox="0 0 24 24" style="position: absolute; right: -34px; bottom: -40px" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="rgba(255,255,255,0.07)"></path></svg>
    <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.68); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{videoLong.host}}</span>
      <span style="color: rgba(255,255,255,0.68); flex-shrink: 0; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></span>
    </div>
    <div style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.68)">press play</span>
        <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.8px; line-height: 1">watch my video</span>
      </div>
      <span style="width: 64px; height: 64px; border-radius: 32px; background: {{accent}}; color: {{accentInk}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"></path></svg></span>
    </div>
  </a>

  <div style="padding: 18px 4px 2px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: {{dim}}">BOOKING · FULL · sits just above “Want my contact?”</div>
  <a href="{{bookingMain.url}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 84px 84px; gap: 10px">
    <div style="grid-column: 1 / 4; grid-row: 1 / 3; border-radius: 26px; background: {{accent}}; color: {{accentInk}}; padding: 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; min-width: 0">
      <span style="display: flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"></rect><path d="M8 2.5v4M16 2.5v4M3 10h18"></path><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"></path></svg>BOOKING</span>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="font-size: 30px; font-weight: 700; letter-spacing: -1px; line-height: 1">book a time</span>
        <span style="font-family: 'DM Mono', monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{bookingMain.host}}</span>
      </div>
    </div>
    <div style="grid-column: 4; grid-row: 1; border-radius: 26px; background: {{heroBg}}; color: {{heroInk}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"></rect><path d="M8 2.5v4M16 2.5v4M3 10h18"></path><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"></path></svg></div>
    <div style="grid-column: 4; grid-row: 2; border-radius: 26px; background: {{tile}}; color: {{ink}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></div>
  </a>
  <div style="padding: 18px 4px 2px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: {{dim}}">BOOKING · LONG / UNKNOWN HOST</div>
  <a href="{{bookingLong.url}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 84px 84px; gap: 10px">
    <div style="grid-column: 1 / 4; grid-row: 1 / 3; border-radius: 26px; background: {{accent}}; color: {{accentInk}}; padding: 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; min-width: 0">
      <span style="display: flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"></rect><path d="M8 2.5v4M16 2.5v4M3 10h18"></path><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"></path></svg>BOOKING</span>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="font-size: 30px; font-weight: 700; letter-spacing: -1px; line-height: 1">book a time</span>
        <span style="font-family: 'DM Mono', monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{bookingLong.host}}</span>
      </div>
    </div>
    <div style="grid-column: 4; grid-row: 1; border-radius: 26px; background: {{heroBg}}; color: {{heroInk}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"></rect><path d="M8 2.5v4M16 2.5v4M3 10h18"></path><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"></path></svg></div>
    <div style="grid-column: 4; grid-row: 2; border-radius: 26px; background: {{tile}}; color: {{ink}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></div>
  </a>

  <div style="padding: 18px 4px 2px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: {{dim}}">RESUME · FULL · sits after orgs &amp; clubs, above booking</div>
  <div style="border-radius: 26px; background: {{tile}}; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.1">my résumé</h2>
      <span style="font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; color: {{dim}}; white-space: nowrap">grab a copy</span>
    </div>
    <a href="{{resumeFull.fileUrl}}" download style="box-sizing: border-box; min-height: 52px; padding: 10px 18px; border-radius: 18px; background: {{heroBg}}; color: {{heroInk}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; line-height: 1.25; text-align: center">
      <span style="display: flex; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg></span>
      <span style="min-width: 0; overflow-wrap: anywhere">{{resumeFull.label}}</span>
    </a>
  </div>
  <div style="padding: 18px 4px 2px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: {{dim}}">RESUME · SPARSE · label missing, default “Résumé / CV”</div>
  <div style="border-radius: 26px; background: {{tile}}; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.1">my résumé</h2>
      <span style="font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; color: {{dim}}; white-space: nowrap">grab a copy</span>
    </div>
    <a href="{{resumeSparse.fileUrl}}" download style="box-sizing: border-box; min-height: 52px; padding: 10px 18px; border-radius: 18px; background: {{heroBg}}; color: {{heroInk}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; line-height: 1.25; text-align: center">
      <span style="display: flex; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg></span>
      <span style="min-width: 0; overflow-wrap: anywhere">{{resumeSparse.label}}</span>
    </a>
  </div>

  <div style="padding: 18px 4px 2px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: {{dim}}">PORTFOLIO · FULL (12) · sits after the photo dump</div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
    <div style="grid-column: span 2; border-radius: 26px; background: {{heroBg}}; color: {{heroInk}}; padding: 16px; box-sizing: border-box; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-width: 0">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; opacity: 0.75">PORTFOLIO</span>
        <span style="width: 10px; height: 10px; border-radius: 5px; background: {{accent}}"></span>
      </div>
      <div style="display: flex; flex-direction: column">
        <h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.1">things I made</h2>
        <span style="font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; opacity: 0.75">tap to open</span>
      </div>
    </div>
    <sc-for list="{{portfolioFull}}" as="p" hint-placeholder-count="3">
      <a href="{{p.url}}" style="grid-column: {{p.span}}; border-radius: 26px; background: {{tile}}; color: {{ink}}; overflow: hidden; display: flex; flex-direction: column; min-width: 0">
        <sc-if value="{{p.hasThumb}}" hint-placeholder-val="{{ false }}">
          <div style="position: relative; aspect-ratio: {{p.ratio}}; background: {{chipBg}}">
            <img src="{{p.thumbUrl}}" alt="" style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%">
            <span style="position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 16px; background: #FFFFFF; color: #111111; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></span>
          </div>
        </sc-if>
        <div style="padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <sc-if value="{{p.noThumb}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px">
              <span style="width: 40px; height: 40px; border-radius: 14px; background: {{accentSoft}}; color: {{accentText}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span>
              <span style="color: {{dim}}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></span>
            </div>
          </sc-if>
          <span style="font-size: 15px; font-weight: 700; line-height: 1.2; letter-spacing: -0.2px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere">{{p.title}}</span>
          <sc-if value="{{p.hasDesc}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 13px; line-height: 1.35; color: {{dim}}; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; overflow-wrap: anywhere">{{p.desc}}</span>
          </sc-if>
        </div>
      </a>
    </sc-for>
  </div>
  <div style="padding: 18px 4px 2px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: {{dim}}">PORTFOLIO · SPARSE · one item, no thumb, no desc</div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
    <div style="grid-column: span 2; border-radius: 26px; background: {{heroBg}}; color: {{heroInk}}; padding: 16px; box-sizing: border-box; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-width: 0">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; opacity: 0.75">PORTFOLIO</span>
        <span style="width: 10px; height: 10px; border-radius: 5px; background: {{accent}}"></span>
      </div>
      <div style="display: flex; flex-direction: column">
        <h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.1">things I made</h2>
        <span style="font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; opacity: 0.75">tap to open</span>
      </div>
    </div>
    <sc-for list="{{portfolioSparse}}" as="p" hint-placeholder-count="3">
      <a href="{{p.url}}" style="grid-column: {{p.span}}; border-radius: 26px; background: {{tile}}; color: {{ink}}; overflow: hidden; display: flex; flex-direction: column; min-width: 0">
        <sc-if value="{{p.hasThumb}}" hint-placeholder-val="{{ false }}">
          <div style="position: relative; aspect-ratio: {{p.ratio}}; background: {{chipBg}}">
            <img src="{{p.thumbUrl}}" alt="" style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%">
            <span style="position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 16px; background: #FFFFFF; color: #111111; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></span>
          </div>
        </sc-if>
        <div style="padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0">
