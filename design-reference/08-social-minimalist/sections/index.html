<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #1F4BFF;outline-offset:3px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes sheetUp{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
.mn-clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.mn-clamp3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.mn-one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 08-social-minimalist — new sections — from MinimalistSections.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: {{pageMin}}; box-sizing: border-box; background: {{bg}}; font-family: 'Inter Tight', system-ui, sans-serif; color: {{ink}}; display: flex; flex-direction: column; overflow: hidden; transition: background 400ms ease, color 400ms ease">

  <!-- Top bar (copied from the template) -->
  <div style="height: 52px; padding: 0 10px 0 24px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1.2px; color: {{dim}}">[YOUR BRAND]</span>
    <div style="display: flex; color: {{ink}}">
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        </sc-if>
      </button>
    </div>
  </div>

  <!-- Board intro -->
  <div style="padding: 18px 24px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: {{dim}}">
      <span style="width: 7px; height: 7px; border-radius: 4px; background: {{accent}}"></span>
      <span>New sections — Social Minimalist</span>
    </div>
    <h1 style="margin: 0; font-size: 60px; line-height: 0.92; font-weight: 600; letter-spacing: -3px">Sections<span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -1px; color: {{accent}}">.</span></h1>
    <span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">STANDARD · VIDEO · BOOKING · RESUME · PORTFOLIO · SERVICES · EXPERIENCE · SKILLS · STATS</span>
  </div>

  <!-- ===================== VIDEO ===================== -->
  <div style="margin-top: 56px; padding: 14px 24px 0; box-shadow: inset 0 1px 0 {{line}}"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">VIDEO · FULL · sits after On repeat</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Video</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">press play</span>
    </div>
    <a href="{{videoFull.url}}" aria-label="Watch the video on {{videoFull.host}}" style="border-radius: 24px; background: {{tile}}; padding: 14px; display: flex; align-items: center; gap: 14px">
      <div style="width: 84px; height: 84px; border-radius: 42px; background: {{accent}}; color: {{onAccent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6l11-6.8z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex-grow: 1">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1; letter-spacing: -0.3px">Watch the <span style="font-style: italic">video</span></span>
        <span class="mn-one" style="font-family: 'DM Mono', monospace; font-size: 11px; color: {{dim}}">{{videoFull.host}}</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{faint}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-right: 6px" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
    </a>
  </div>

  <div style="margin-top: 40px; padding: 0 24px"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">VIDEO · LONG / UNKNOWN HOST · host truncates</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Video</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">press play</span>
    </div>
    <a href="{{videoLong.url}}" aria-label="Watch the video on {{videoLong.host}}" style="border-radius: 24px; background: {{tile}}; padding: 14px; display: flex; align-items: center; gap: 14px">
      <div style="width: 84px; height: 84px; border-radius: 42px; background: {{accent}}; color: {{onAccent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6l11-6.8z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex-grow: 1">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1; letter-spacing: -0.3px">Watch the <span style="font-style: italic">video</span></span>
        <span class="mn-one" style="font-family: 'DM Mono', monospace; font-size: 11px; color: {{dim}}">{{videoLong.host}}</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{faint}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-right: 6px" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
    </a>
  </div>

  <!-- ===================== BOOKING ===================== -->
  <div style="margin-top: 56px; padding: 14px 24px 0; box-shadow: inset 0 1px 0 {{line}}"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">BOOKING · FULL · sits after Résumé, before the contact tile</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Booking</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">let's meet</span>
    </div>
    <a href="{{bookingFull.url}}" style="min-height: 64px; border-radius: 32px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; padding: 8px 8px 8px 24px; box-sizing: border-box; gap: 12px">
      <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">Book a time with me</span>
        <span class="mn-one" style="font-family: 'DM Mono', monospace; font-size: 11px; opacity: 0.6">{{bookingFull.host}}</span>
      </div>
      <div style="width: 48px; height: 48px; border-radius: 24px; background: {{accent}}; color: {{onAccent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M16 3v4M8 3v4M3.5 10.5h17"></path></svg>
      </div>
    </a>
  </div>

  <div style="margin-top: 40px; padding: 0 24px"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">BOOKING · LONG / UNKNOWN HOST · host truncates</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Booking</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">let's meet</span>
    </div>
    <a href="{{bookingLong.url}}" style="min-height: 64px; border-radius: 32px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; padding: 8px 8px 8px 24px; box-sizing: border-box; gap: 12px">
      <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">Book a time with me</span>
        <span class="mn-one" style="font-family: 'DM Mono', monospace; font-size: 11px; opacity: 0.6">{{bookingLong.host}}</span>
      </div>
      <div style="width: 48px; height: 48px; border-radius: 24px; background: {{accent}}; color: {{onAccent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M16 3v4M8 3v4M3.5 10.5h17"></path></svg>
      </div>
    </a>
  </div>

  <!-- ===================== RESUME ===================== -->
  <div style="margin-top: 56px; padding: 14px 24px 0; box-shadow: inset 0 1px 0 {{line}}"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">RÉSUMÉ · FULL · sits after Skills</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Résumé</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">the long version</span>
    </div>
    <a href="{{resumeFull.fileUrl}}" download style="min-height: 64px; border-radius: 32px; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; padding: 8px 8px 8px 24px; box-sizing: border-box; gap: 12px">
      <span class="mn-clamp2" style="flex-grow: 1; min-width: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.25">{{resumeFull.label}}</span>
      <div style="width: 48px; height: 48px; border-radius: 24px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v12M7 10.5l5 5 5-5M5 20.5h14"></path></svg>
      </div>
    </a>
  </div>

  <div style="margin-top: 40px; padding: 0 24px"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">RÉSUMÉ · SPARSE · no label, default text</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Résumé</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">the long version</span>
    </div>
    <a href="{{resumeSparse.fileUrl}}" download style="min-height: 64px; border-radius: 32px; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; padding: 8px 8px 8px 24px; box-sizing: border-box; gap: 12px">
      <span class="mn-clamp2" style="flex-grow: 1; min-width: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.25">{{resumeSparse.label}}</span>
      <div style="width: 48px; height: 48px; border-radius: 24px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v12M7 10.5l5 5 5-5M5 20.5h14"></path></svg>
      </div>
    </a>
  </div>

  <!-- ===================== PORTFOLIO ===================== -->
  <div style="margin-top: 56px; padding: 14px 24px 0; box-shadow: inset 0 1px 0 {{line}}"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">PORTFOLIO · FULL (12) · sits after Photo dump</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Portfolio</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">things I made</span>
    </div>
    <div style="margin-top: 8px; box-shadow: inset 0 1px 0 {{line}}; display: flex; flex-direction: column">
      <sc-for list="{{portfolioFull}}" as="p" hint-placeholder-count="12">
        <a href="{{p.url}}" style="display: flex; align-items: flex-start; gap: 12px; padding: 16px 8px; box-shadow: inset 0 -1px 0 {{line}}">
          <span style="width: 24px; flex-shrink: 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.1; color: {{dim}}">{{p.num}}</span>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
            <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.25; overflow-wrap: anywhere">{{p.title}}</span>
            <sc-if value="{{p.hasDesc}}" hint-placeholder-val="{{ true }}">
              <span class="mn-clamp3" style="font-size: 14px; line-height: 1.45; color: {{dim}}">{{p.desc}}</span>
            </sc-if>
          </div>
          <sc-if value="{{p.hasThumb}}" hint-placeholder-val="{{ false }}">
            <div style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; background: {{tile}}; flex-shrink: 0">
              <img src="{{p.thumbUrl}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
            </div>
          </sc-if>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{faint}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: 40px; padding: 0 24px"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">PORTFOLIO · SPARSE · one item, no desc, no thumb</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Portfolio</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">things I made</span>
    </div>
    <div style="margin-top: 8px; box-shadow: inset 0 1px 0 {{line}}; display: flex; flex-direction: column">
      <sc-for list="{{portfolioSparse}}" as="p" hint-placeholder-count="1">
        <a href="{{p.url}}" style="display: flex; align-items: flex-start; gap: 12px; padding: 16px 8px; box-shadow: inset 0 -1px 0 {{line}}">
          <span style="width: 24px; flex-shrink: 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.1; color: {{dim}}">{{p.num}}</span>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
            <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.25; overflow-wrap: anywhere">{{p.title}}</span>
            <sc-if value="{{p.hasDesc}}" hint-placeholder-val="{{ false }}">
              <span class="mn-clamp3" style="font-size: 14px; line-height: 1.45; color: {{dim}}">{{p.desc}}</span>
            </sc-if>
          </div>
          <sc-if value="{{p.hasThumb}}" hint-placeholder-val="{{ false }}">
            <div style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; background: {{tile}}; flex-shrink: 0">
              <img src="{{p.thumbUrl}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
            </div>
          </sc-if>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{faint}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <!-- ===================== SERVICES ===================== -->
  <div style="margin-top: 56px; padding: 14px 24px 0; box-shadow: inset 0 1px 0 {{line}}"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">SERVICES · FULL (20) · sits after Portfolio</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Services</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">what I offer</span>
    </div>
    <div style="margin-top: 8px; box-shadow: inset 0 1px 0 {{line}}; display: flex; flex-direction: column">
      <sc-for list="{{servicesFull}}" as="s" hint-placeholder-count="20">
        <div style="min-height: 52px; box-sizing: border-box; padding: 13px 8px; box-shadow: inset 0 -1px 0 {{line}}; display: flex; justify-content: space-between; align-items: baseline; gap: 16px">
          <span style="font-size: 16px; font-weight: 500; letter-spacing: -0.2px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere">{{s.name}}</span>
          <sc-if value="{{s.hasPrice}}" hint-placeholder-val="{{ true }}">
            <span style="flex-shrink: 0; max-width: 46%; text-align: right; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.15; overflow-wrap: anywhere">{{s.price}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: 40px; padding: 0 24px"><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: {{dim}}">SERVICES · SPARSE · one item, no price</span></div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="padding: 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 13px; color: {{dim}}">Services</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; color: {{dim}}">what I offer</span>
    </div>
    <div style="margin-top: 8px; box-shadow: inset 0 1px 0 {{line}}; display: flex; flex-direction: column">
      <sc-for list="{{servicesSparse}}" as="s" hint-placeholder-count="1">
        <div style="min-height: 52px; box-sizing: border-box; padding: 13px 8px; box-shadow: inset 0 -1px 0 {{line}}; display: flex; justify-content: space-between; align-items: baseline; gap: 16px">
          <span style="font-size: 16px; font-weight: 500; letter-spacing: -0.2px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere">{{s.name}}</span>
          <sc-if value="{{s.hasPrice}}" hint-placeholder-val="{{ false }}">
            <span style="flex-shrink: 0; max-width: 46%; text-align: right; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.15; overflow-wrap: anywhere">{{s.price}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- ===================== EXPERIENCE ===================== -->
