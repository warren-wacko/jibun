<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #1F4BFF;outline-offset:3px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes sheetUp{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 08-social-minimalist — starter — from StudentMinimalStarter.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: {{pageMin}}; box-sizing: border-box; background: {{bg}}; font-family: 'Inter Tight', system-ui, sans-serif; color: {{ink}}; display: flex; flex-direction: column; overflow: hidden; transition: background 400ms ease, color 400ms ease">

  <div style="height: 52px; padding: 0 10px 0 24px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1.2px; color: {{dim}}">[YOUR BRAND]</span>
    <div style="display: flex; color: {{ink}}">
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        </sc-if>
      </button>
      <button type="button" onClick="{{shareCard}}" aria-label="Share this card" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="m16 6-4-4-4 4"></path><path d="M12 2v13"></path></svg>
      </button>
    </div>
  </div>

  <div class="anim" style="padding: 18px 24px 0; display: flex; flex-direction: column; gap: 10px; animation: rise 700ms cubic-bezier(.2,.8,.2,1) both">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: {{dim}}">
      <span style="width: 7px; height: 7px; border-radius: 4px; background: {{accent}}"></span>
      <span>BSCS · 3rd year</span>
      <span style="color: {{faint}}">/</span>
      <span>[School name]</span>
    </div>
    <h1 style="margin: 0; font-size: 72px; line-height: 0.92; font-weight: 600; letter-spacing: -3.6px">Warren<span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -1px; color: {{accent}}">.</span></h1>
  </div>

  <div class="anim" style="position: relative; padding: 24px 16px 0; animation: rise 800ms cubic-bezier(.2,.8,.2,1) 120ms both">
    <div style="height: 440px; border-radius: 28px; overflow: hidden; background: {{tile}}">
      <img src="assets/photo.jpg" alt="Photo of Warren Jacob Abdon" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%">
    </div>
    <div style="position: absolute; right: 2px; bottom: -40px; width: 104px; height: 104px; border-radius: 52px; background: {{accent}}; color: {{accentInk}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(0,0,0,0.14)">
      <svg class="anim" width="104" height="104" viewBox="0 0 100 100" style="position: absolute; inset: 0; animation: spin 14s linear infinite">
        <defs><path id="minimalSayHiS" d="M50,50 m-36,0 a36,36 0 1,1 72,0 a36,36 0 1,1 -72,0"></path></defs>
        <text fill="currentColor" style="font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 3px"><textPath href="#minimalSayHiS">SAY HI · SAY HI · SAY HI · </textPath></text>
      </svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg>
    </div>
  </div>

  <div style="padding: 54px 24px 0">
    <p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 1.15; letter-spacing: -0.3px"><span style="font-style: italic">coffee, anime</span> &amp; last-minute requirements.</p>
  </div>

  <div style="padding: 28px 16px 0">
    <a href="https://instagram.com/yourname" style="height: 64px; border-radius: 32px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; padding: 0 8px 0 24px; gap: 12px">
      <div style="display: flex; flex-direction: column; flex-grow: 1">
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">Follow me on Instagram</span>
        <span style="font-family: 'DM Mono', monospace; font-size: 11px; opacity: 0.6">@yourname</span>
      </div>
      <div style="width: 48px; height: 48px; border-radius: 24px; background: {{bg}}; color: {{ink}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"></path></svg></div>
    </a>
  </div>

  <div style="padding: 10px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{mainSocials}}" as="m" hint-placeholder-count="4">
      <a href="{{m.href}}" style="height: 116px; border-radius: 24px; background: {{tile}}; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
        <div style="display: flex; justify-content: space-between; align-items: flex-start">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: {{m.bg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{m.isTiktok}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" style="filter: drop-shadow(-1px -1px 0 #25F4EE) drop-shadow(1px 1px 0 #FE2C55)" role="img" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"></path></svg></sc-if>
            <sc-if value="{{m.isFacebook}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="-126.72 -30.72 573.44 573.44" fill="currentColor" role="img" aria-hidden="true"><path d="M80 299.3l0 212.7 116 0 0-212.7 86.5 0 18-97.8-104.5 0 0-34.6c0-51.7 20.3-71.5 72.7-71.5 16.3 0 29.4 .4 37 1.2l0-88.7C291.4 4 256.4 0 236.2 0 129.3 0 80 50.5 80 159.4l0 42.1-66 0 0 97.8 66 0z"></path></svg></sc-if>
            <sc-if value="{{m.isMessenger}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M12 0C5.24 0 0 4.952 0 11.64c0 3.499 1.434 6.521 3.769 8.61a.96.96 0 0 1 .323.683l.065 2.135a.96.96 0 0 0 1.347.85l2.381-1.053a.96.96 0 0 1 .641-.046A13 13 0 0 0 12 23.28c6.76 0 12-4.952 12-11.64S18.76 0 12 0m6.806 7.44c.522-.03.971.567.63 1.094l-4.178 6.457a.707.707 0 0 1-.977.208l-3.87-2.504a.44.44 0 0 0-.49.007l-4.363 3.01c-.637.438-1.415-.317-.995-.966l4.179-6.457a.706.706 0 0 1 .977-.21l3.87 2.505c.15.097.344.094.491-.007l4.362-3.008a.7.7 0 0 1 .364-.13"></path></svg></sc-if>
            <sc-if value="{{m.isDiscord}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"></path></svg></sc-if>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{faint}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">{{m.name}}</span><span style="font-size: 13px; color: {{dim}}">{{m.handle}}</span></div>
      </a>
    </sc-for>
  </div>

  <div style="padding: 22px 24px 0; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 14px; color: {{dim}}">Also on</span>
    <div style="display: flex; gap: 8px; color: {{ink}}">
      <a href="https://open.spotify.com/user/yourname" aria-label="Spotify" style="width: 44px; height: 44px; border-radius: 22px; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"></path></svg></a>
      <a href="https://x.com/yourname" aria-label="X" style="width: 44px; height: 44px; border-radius: 22px; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"></path></svg></a>
      <a href="https://pinterest.com/yourname" aria-label="Pinterest" style="width: 44px; height: 44px; border-radius: 22px; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="-94.72 -30.72 573.44 573.44" fill="currentColor" role="img" aria-hidden="true"><path d="M204 6.5c-102.6 0-204 68.4-204 179.1 0 70.4 39.6 110.4 63.6 110.4 9.9 0 15.6-27.6 15.6-35.4 0-9.3-23.7-29.1-23.7-67.8 0-80.4 61.2-137.4 140.4-137.4 68.1 0 118.5 38.7 118.5 109.8 0 53.1-21.3 152.7-90.3 152.7-24.9 0-46.2-18-46.2-43.8 0-37.8 26.4-74.4 26.4-113.4 0-66.2-93.9-54.2-93.9 25.8 0 16.8 2.1 35.4 9.6 50.7-13.8 59.4-42 147.9-42 209.1 0 18.9 2.7 37.5 4.5 56.4 3.4 3.8 1.7 3.4 6.9 1.5 50.4-69 48.6-82.5 71.4-172.8 12.3 23.4 44.1 36 69.3 36 106.2 0 153.9-103.5 153.9-196.8 0-99.3-85.8-164.1-180-164.1z"></path></svg></a>
      <a href="https://youtube.com/@yourname" aria-label="YouTube" style="width: 44px; height: 44px; border-radius: 22px; box-shadow: inset 0 0 0 1px {{line}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"></path></svg></a>
    </div>
  </div>

  <sc-if value="{{isStandard}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column">

      <div style="margin-top: 44px; padding: 18px 0; box-shadow: inset 0 1px 0 {{line}}, inset 0 -1px 0 {{line}}; overflow: hidden">
        <div class="anim" style="display: flex; width: max-content; animation: marquee 30s linear infinite">
          <sc-for list="{{interestLoop}}" as="it" hint-placeholder-count="14">
            <span style="display: flex; align-items: center; gap: 18px; padding-right: 18px; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 34px; line-height: 1; white-space: nowrap; color: {{it.c}}">{{it.label}}<span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span></span>
          </sc-for>
        </div>
      </div>

      <div style="padding: 40px 16px 0; display: flex; flex-direction: column; gap: 12px">
        <span style="padding: 0 8px; font-size: 13px; color: {{dim}}">On repeat</span>
        <div style="border-radius: 24px; background: {{tile}}; padding: 14px; display: flex; align-items: center; gap: 14px">
          <button type="button" onClick="{{togglePlay}}" aria-label="{{playAria}}" style="all: unset; cursor: pointer; width: 84px; height: 84px; border-radius: 42px; flex-shrink: 0">
            <div class="anim" style="width: 84px; height: 84px; border-radius: 42px; background: repeating-radial-gradient(circle, #111111 0 1.5px, #1C1C1C 1.5px 3px); display: flex; align-items: center; justify-content: center; animation: spin 3.2s linear infinite; animation-play-state: {{spinState}}">
              <div style="width: 30px; height: 30px; border-radius: 15px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><div style="width: 6px; height: 6px; border-radius: 3px; background: #111111"></div></div>
            </div>
