<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Gloock&amp;family=Courier+Prime:wght@400;700&amp;family=Caveat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px dashed #E8604C;outline-offset:3px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes drop{0%{opacity:0;transform:translateY(-18px) rotate(-6deg)}100%{opacity:1}}
@keyframes slap{0%{opacity:0;transform:scale(1.4) rotate(10deg)}100%{opacity:1}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sheetUp{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 07-social-scrapbook — starter — from StudentScrapbookStarter.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: {{pageMin}}; box-sizing: border-box; background-color: {{bg}}; background-image: {{bgDots}}; background-size: 18px 18px; font-family: 'Courier Prime', 'Courier New', monospace; color: {{ink}}; display: flex; flex-direction: column; overflow: hidden; transition: background-color 400ms ease, color 400ms ease">

  <div style="height: 50px; padding: 0 10px 0 20px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 12px; letter-spacing: 1.2px; color: {{dim}}">[YOUR BRAND]</span>
    <div style="display: flex">
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <div style="width: 34px; height: 34px; border-radius: 17px; background: {{paper}}; color: #2A2620; box-shadow: 0 2px 0 rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center">
          <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          </sc-if>
          <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          </sc-if>
        </div>
      </button>
      <button type="button" onClick="{{shareCard}}" aria-label="Share this card" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <div style="width: 34px; height: 34px; border-radius: 17px; background: {{paper}}; color: #2A2620; box-shadow: 0 2px 0 rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="m16 6-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        </div>
      </button>
    </div>
  </div>

  <div style="position: relative; height: 440px">
    <div class="anim" style="position: absolute; left: 30px; top: 18px; width: 290px; transform: rotate(-2.5deg); animation: drop 700ms cubic-bezier(.2,.8,.2,1) both">
      <div style="background: {{paper}}; padding: 10px 10px 26px; box-shadow: 0 14px 28px rgba(0,0,0,0.16); clip-path: {{tornClip}}">
        <img src="assets/photo.jpg" alt="Photo of Warren Jacob Abdon" style="display: block; width: 100%; height: 340px; object-fit: cover; object-position: 50% 18%; filter: saturate(0.9) contrast(1.02)">
      </div>
      <div style="position: absolute; left: -18px; top: -10px; width: 92px; height: 26px; background: {{tape}}; transform: rotate(-32deg); opacity: 0.9"></div>
      <div style="position: absolute; right: -16px; top: -8px; width: 92px; height: 26px; background: {{tape}}; transform: rotate(28deg); opacity: 0.9"></div>
    </div>

    <div class="anim" style="position: absolute; right: 14px; top: 64px; height: 30px; padding: 0 12px; background: #1B1A18; color: #F4F1EA; border-radius: 3px; display: flex; align-items: center; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 2px; box-shadow: 0 4px 0 rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.12); transform: rotate(6deg); animation: slap 500ms cubic-bezier(.2,.8,.2,1) 500ms both">BSCS · 3RD YEAR</div>

    <div class="anim" style="position: absolute; right: 22px; top: 250px; width: 76px; height: 76px; border-radius: 38px; background: {{accent}}; color: {{accentInk}}; display: flex; align-items: center; justify-content: center; font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; box-shadow: 0 6px 0 rgba(0,0,0,0.12); animation: wiggle 3s ease-in-out infinite">hi!</div>

    <div class="anim" style="position: absolute; left: 18px; top: 382px; padding: 8px 16px 8px 30px; background-color: #FBF8F1; background-image: linear-gradient(90deg, transparent 18px, #E9A3A3 18px, #E9A3A3 19.5px, transparent 19.5px), repeating-linear-gradient(180deg, transparent 0 21px, #BFD3E6 21px 22px); color: #2A2620; font-size: 14px; font-weight: 700; box-shadow: 0 6px 14px rgba(0,0,0,0.12); transform: rotate(2deg); animation: slap 500ms cubic-bezier(.2,.8,.2,1) 650ms both">[School name]</div>
  </div>

  <div style="padding: 18px 14px 0; display: flex; justify-content: center; align-items: center; gap: 4px">
    <sc-for list="{{letters}}" as="l" hint-placeholder-count="6">
      <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: {{l.h}}; padding: 0 6px; box-sizing: border-box; background: {{l.bg}}; color: {{l.ink}}; font-family: {{l.font}}; font-size: {{l.size}}; line-height: 1; transform: {{l.rot}}; box-shadow: 0 3px 0 rgba(0,0,0,0.14)">{{l.ch}}</span>
    </sc-for>
  </div>

  <div style="padding: 18px 26px 0; display: flex; justify-content: center">
    <p style="margin: 0; text-align: center; font-family: 'Caveat', cursive; font-size: 27px; font-weight: 600; line-height: 1.2; color: {{ink}}"><span style="background: {{highlight}}; padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone">coffee, anime &amp; last-minute requirements</span></p>
  </div>

  <div style="margin: 26px 0 0; height: 16px; background: {{checker}}; background-size: 16px 16px"></div>

  <div style="padding: 26px 16px 0">
    <a href="https://instagram.com/yourname" class="anim" style="display: flex; height: 96px; background: {{accent}}; color: {{accentInk}}; -webkit-mask: radial-gradient(circle at 0 50%, transparent 13px, #000 13.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 13px, #000 13.5px) right / 51% 100% no-repeat; mask: radial-gradient(circle at 0 50%, transparent 13px, #000 13.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 13px, #000 13.5px) right / 51% 100% no-repeat; transform: rotate(-1deg); animation: drop 600ms cubic-bezier(.2,.8,.2,1) 300ms both">
      <div style="flex-grow: 1; padding: 0 12px 0 28px; display: flex; flex-direction: column; justify-content: center; gap: 2px">
        <span style="font-size: 11px; letter-spacing: 2px; font-weight: 700; opacity: 0.75">ADMIT ONE · NO. 0001</span>
        <span style="font-family: 'Archivo Black', sans-serif; font-size: 23px; letter-spacing: -0.4px; line-height: 1.05">FOLLOW ME ON IG</span>
        <span style="font-size: 12px; opacity: 0.8">@yourname</span>
      </div>
      <div style="width: 84px; flex-shrink: 0; border-left: 2px dashed {{ticketDash}}; display: flex; align-items: center; justify-content: center; padding-right: 10px">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: {{accentInk}}; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"></path></svg></div>
      </div>
    </a>
  </div>

  <div style="padding: 28px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 14px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <a href="{{c.href}}" style="position: relative; height: 124px; padding: 14px; box-sizing: border-box; background-color: {{c.paper}}; background-image: {{c.pattern}}; color: #2A2620; box-shadow: 0 8px 16px rgba(0,0,0,0.12); transform: {{c.rot}}; display: flex; flex-direction: column; justify-content: space-between">
        <div style="position: absolute; left: 50%; top: -9px; width: 56px; height: 18px; margin-left: -28px; background: {{tape}}; opacity: 0.85; transform: {{c.tapeRot}}"></div>
        <div style="width: 40px; height: 40px; border-radius: 12px; background: {{c.bg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{c.isTiktok}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" style="filter: drop-shadow(-1px -1px 0 #25F4EE) drop-shadow(1px 1px 0 #FE2C55)" role="img" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"></path></svg></sc-if>
          <sc-if value="{{c.isFacebook}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="-126.72 -30.72 573.44 573.44" fill="currentColor" role="img" aria-hidden="true"><path d="M80 299.3l0 212.7 116 0 0-212.7 86.5 0 18-97.8-104.5 0 0-34.6c0-51.7 20.3-71.5 72.7-71.5 16.3 0 29.4 .4 37 1.2l0-88.7C291.4 4 256.4 0 236.2 0 129.3 0 80 50.5 80 159.4l0 42.1-66 0 0 97.8 66 0z"></path></svg></sc-if>
          <sc-if value="{{c.isMessenger}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M12 0C5.24 0 0 4.952 0 11.64c0 3.499 1.434 6.521 3.769 8.61a.96.96 0 0 1 .323.683l.065 2.135a.96.96 0 0 0 1.347.85l2.381-1.053a.96.96 0 0 1 .641-.046A13 13 0 0 0 12 23.28c6.76 0 12-4.952 12-11.64S18.76 0 12 0m6.806 7.44c.522-.03.971.567.63 1.094l-4.178 6.457a.707.707 0 0 1-.977.208l-3.87-2.504a.44.44 0 0 0-.49.007l-4.363 3.01c-.637.438-1.415-.317-.995-.966l4.179-6.457a.706.706 0 0 1 .977-.21l3.87 2.505c.15.097.344.094.491-.007l4.362-3.008a.7.7 0 0 1 .364-.13"></path></svg></sc-if>
          <sc-if value="{{c.isDiscord}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="-1.44 -1.44 26.88 26.88" fill="currentColor" role="img" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"></path></svg></sc-if>
        </div>
        <div style="display: flex; flex-direction: column">
          <span style="font-family: 'Gloock', Georgia, serif; font-size: 21px; line-height: 1.05">{{c.name}}</span>
          <span style="font-family: 'Caveat', cursive; font-size: 18px; font-weight: 600; color: #6A6255">{{c.note}}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="padding: 34px 0 0; display: flex; justify-content: center">
    <div style="width: 300px; transform: rotate(1.2deg); filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12))">
      <div style="background: #FBFAF6; color: #2A2620; padding: 18px 20px 24px; -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 8px repeat-x; mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 8px repeat-x">
        <div style="text-align: center; font-weight: 700; font-size: 15px; letter-spacing: 3px">ALSO FIND ME ON</div>
        <div style="text-align: center; font-size: 11px; color: #8A8276; margin-top: 2px">receipt no. 0042 · thank u for scrolling</div>
        <div style="margin: 12px 0 4px; border-top: 2px dashed #CFC8BA"></div>
        <sc-for list="{{receipt}}" as="r" hint-placeholder-count="4">
          <a href="{{r.href}}" style="height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px">
            <span style="width: 10px; height: 10px; border-radius: 5px; background: {{r.c}}; flex-shrink: 0"></span>
            <span style="font-weight: 700">{{r.name}}</span>
            <span style="flex-grow: 1; height: 1px; border-bottom: 2px dotted #CFC8BA; margin: 0 4px"></span>
            <span>{{r.handle}}</span>
          </a>
        </sc-for>
        <div style="margin: 4px 0 10px; border-top: 2px dashed #CFC8BA"></div>
        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 14px"><span>TOTAL</span><span>4 socials</span></div>
        <div style="margin-top: 12px; height: 34px; background: repeating-linear-gradient(90deg, #2A2620 0 2px, transparent 2px 4px, #2A2620 4px 5px, transparent 5px 8px, #2A2620 8px 11px, transparent 11px 13px)"></div>
      </div>
    </div>
  </div>

  <sc-if value="{{isStandard}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column">

      <div style="margin: 40px -10px 0; height: 46px; background: {{tape}}; transform: rotate(-2deg); overflow: hidden; display: flex; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08)">
        <div class="anim" style="display: flex; width: max-content; animation: marquee 22s linear infinite">
          <sc-for list="{{interestLoop}}" as="it" hint-placeholder-count="14">
            <span style="padding: 0 14px; font-family: 'Archivo Black', sans-serif; font-size: 17px; letter-spacing: 0.5px; color: {{tapeInk}}; white-space: nowrap; display: flex; align-items: center; gap: 14px">{{it.label}}<span style="width: 6px; height: 6px; border-radius: 3px; background: {{tapeInk}}"></span></span>
          </sc-for>
        </div>
      </div>

      <div style="padding: 40px 16px 0">
        <div style="position: relative; height: 176px; background-color: #CFAE84; background-image: radial-gradient(rgba(90,60,30,0.18) 1px, transparent 1.5px); background-size: 6px 6px; color: #2A2016; box-shadow: 0 10px 20px rgba(0,0,0,0.14); transform: rotate(-1deg); overflow: hidden; display: flex; align-items: center">
          <button type="button" onClick="{{togglePlay}}" aria-label="{{playAria}}" style="all: unset; cursor: pointer; position: absolute; left: -24px; top: 13px; width: 150px; height: 150px; border-radius: 75px">
