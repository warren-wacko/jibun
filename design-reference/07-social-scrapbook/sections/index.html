<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren Jacob Abdon — Digital Card</title>
<meta name="description" content="Software Engineer · Full-Stack Developer. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Gloock&amp;family=Courier+Prime:wght@400;700&amp;family=Caveat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px dashed #E8604C;outline-offset:3px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes drop{0%{opacity:0;transform:translateY(-18px) rotate(-6deg)}100%{opacity:1}}
@keyframes slap{0%{opacity:0;transform:scale(1.4) rotate(10deg)}100%{opacity:1}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sheetUp{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}100%{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
.sb-ticket{-webkit-mask:radial-gradient(circle at 0 50%,transparent 13px,#000 13.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 13px,#000 13.5px) right/51% 100% no-repeat;mask:radial-gradient(circle at 0 50%,transparent 13px,#000 13.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 13px,#000 13.5px) right/51% 100% no-repeat}
.sb-stub{-webkit-mask:radial-gradient(circle at 0 50%,transparent 9px,#000 9.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 9px,#000 9.5px) right/51% 100% no-repeat;mask:radial-gradient(circle at 0 50%,transparent 9px,#000 9.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 9px,#000 9.5px) right/51% 100% no-repeat}
.sb-zig{-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x}
.sb-clamp3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.sb-ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<style>
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app>div{width:100% !important;max-width:430px;margin:0 auto;min-height:100vh !important;min-height:100dvh !important}
</style>
</head>
<body>
<!-- 07-social-scrapbook — new sections — from ScrapbookSections.dc.html -->
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; min-height: {{pageMin}}; box-sizing: border-box; background-color: {{bg}}; background-image: {{bgDots}}; background-size: 18px 18px; font-family: 'Courier Prime', 'Courier New', monospace; color: {{ink}}; display: flex; flex-direction: column; overflow: hidden; transition: background-color 400ms ease, color 400ms ease">

  <div style="height: 50px; padding: 0 10px 0 20px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 12px; letter-spacing: 1.2px; color: {{dim}}">[YOUR BRAND]</span>
    <div style="display: flex">
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <div style="width: 34px; height: 34px; border-radius: 17px; background: {{paper}}; color: #2A2620; box-shadow: 0 2px 0 rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center">
          <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          </sc-if>
          <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          </sc-if>
        </div>
      </button>
      <button type="button" onClick="{{shareCard}}" aria-label="Share this card" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <div style="width: 34px; height: 34px; border-radius: 17px; background: {{paper}}; color: #2A2620; box-shadow: 0 2px 0 rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="m16 6-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        </div>
      </button>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 11px; letter-spacing: 1.6px; font-weight: 700; color: {{labelInk}}">NEW SECTIONS — SOCIAL SCRAPBOOK</span>
    <span style="font-family: 'Caveat', cursive; font-size: 22px; font-weight: 600; color: {{ink}}">video, booking, résumé, projects, services, experience, skills &amp; stats</span>
  </div>
  <div style="margin: 20px 0 0; height: 16px; background: {{checker}}; background-size: 16px 16px"></div>

  <!-- ================= VIDEO ================= -->
  <div style="padding: 34px 20px 0; font-size: 11px; letter-spacing: 1.6px; font-weight: 700; color: {{labelInk}}">VIDEO · FULL · sits after the song record</div>
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <span style="padding: 0 6px; font-family: 'Caveat', cursive; font-size: 32px; font-weight: 700"><span style="background: {{highlight}}; padding: 0 6px">watch this</span></span>
    <sc-for list="{{videoMain}}" as="v" hint-placeholder-count="1">
      <a href="{{v.url}}" aria-label="Watch video on {{v.host}}" style="position: relative; display: block; margin: 6px 4px 0; padding: 10px 10px 4px; background: #FBF8F1; color: #2A2620; box-shadow: 0 14px 28px rgba(0,0,0,0.16); transform: rotate(-1.2deg)">
        <div style="position: absolute; left: -14px; top: -8px; width: 78px; height: 22px; background: {{tape}}; transform: rotate(-24deg); opacity: 0.9"></div>
        <div style="position: absolute; right: -12px; top: -6px; width: 78px; height: 22px; background: {{tape}}; transform: rotate(20deg); opacity: 0.9"></div>
        <div style="position: relative; padding: 16px 10px; background: #1B1A18">
          <div style="position: absolute; left: 4px; right: 4px; top: 4px; height: 7px; background: repeating-linear-gradient(90deg, transparent 0 5px, #EDE6D8 5px 13px, transparent 13px 18px)"></div>
          <div style="position: absolute; left: 4px; right: 4px; bottom: 4px; height: 7px; background: repeating-linear-gradient(90deg, transparent 0 5px, #EDE6D8 5px 13px, transparent 13px 18px)"></div>
          <div style="aspect-ratio: 16 / 9; background-color: #2E2A25; background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 4px); display: flex; align-items: center; justify-content: center">
            <div style="width: 68px; height: 68px; border-radius: 34px; background: {{accent}}; color: {{accentInk}}; box-shadow: 0 6px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true" style="margin-left: 4px"><path d="M7 4.5v15l12-7.5z"></path></svg>
            </div>
          </div>
        </div>
        <div style="min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 2px">
          <span style="font-family: 'Caveat', cursive; font-size: 23px; font-weight: 700; flex-shrink: 0">watch on</span>
          <span class="sb-ell" style="flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.5px">{{v.host}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="padding: 34px 20px 0; font-size: 11px; letter-spacing: 1.6px; font-weight: 700; color: {{labelInk}}">VIDEO · LONG / UNKNOWN HOST · host truncates on one line</div>
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <span style="padding: 0 6px; font-family: 'Caveat', cursive; font-size: 32px; font-weight: 700"><span style="background: {{highlight}}; padding: 0 6px">watch this</span></span>
    <sc-for list="{{videoLong}}" as="v" hint-placeholder-count="1">
      <a href="{{v.url}}" aria-label="Watch video on {{v.host}}" style="position: relative; display: block; margin: 6px 4px 0; padding: 10px 10px 4px; background: #FBF8F1; color: #2A2620; box-shadow: 0 14px 28px rgba(0,0,0,0.16); transform: rotate(-1.2deg)">
        <div style="position: absolute; left: -14px; top: -8px; width: 78px; height: 22px; background: {{tape}}; transform: rotate(-24deg); opacity: 0.9"></div>
        <div style="position: absolute; right: -12px; top: -6px; width: 78px; height: 22px; background: {{tape}}; transform: rotate(20deg); opacity: 0.9"></div>
        <div style="position: relative; padding: 16px 10px; background: #1B1A18">
          <div style="position: absolute; left: 4px; right: 4px; top: 4px; height: 7px; background: repeating-linear-gradient(90deg, transparent 0 5px, #EDE6D8 5px 13px, transparent 13px 18px)"></div>
          <div style="position: absolute; left: 4px; right: 4px; bottom: 4px; height: 7px; background: repeating-linear-gradient(90deg, transparent 0 5px, #EDE6D8 5px 13px, transparent 13px 18px)"></div>
          <div style="aspect-ratio: 16 / 9; background-color: #2E2A25; background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 4px); display: flex; align-items: center; justify-content: center">
            <div style="width: 68px; height: 68px; border-radius: 34px; background: {{accent}}; color: {{accentInk}}; box-shadow: 0 6px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true" style="margin-left: 4px"><path d="M7 4.5v15l12-7.5z"></path></svg>
            </div>
          </div>
        </div>
        <div style="min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 2px">
          <span style="font-family: 'Caveat', cursive; font-size: 23px; font-weight: 700; flex-shrink: 0">watch on</span>
          <span class="sb-ell" style="flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.5px">{{v.host}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
        </div>
      </a>
    </sc-for>
  </div>

  <!-- ================= BOOKING ================= -->
  <div style="padding: 44px 20px 0; font-size: 11px; letter-spacing: 1.6px; font-weight: 700; color: {{labelInk}}">BOOKING · FULL · sits after Video, before the contact note</div>
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <span style="padding: 0 6px; font-family: 'Caveat', cursive; font-size: 32px; font-weight: 700"><span style="background: {{highlight}}; padding: 0 6px">book a slot</span></span>
    <sc-for list="{{bookingMain}}" as="b" hint-placeholder-count="1">
      <div style="filter: drop-shadow(0 8px 12px rgba(0,0,0,0.14)); transform: rotate(1deg)">
        <a href="{{b.url}}" class="sb-ticket" style="display: flex; min-height: 104px; background-color: #FBF8F1; background-image: repeating-linear-gradient(180deg, transparent 0 19px, #C9DAEA 19px 20px); color: #2A2620">
          <div style="flex: 1 1 auto; min-width: 0; padding: 12px 12px 12px 28px; display: flex; flex-direction: column; justify-content: center; gap: 2px">
            <span style="font-size: 11px; letter-spacing: 2px; font-weight: 700; color: #5A5246">ADMIT ONE · BOOKING</span>
            <span style="font-family: 'Archivo Black', sans-serif; font-size: 23px; letter-spacing: -0.4px; line-height: 1.05">BOOK A SLOT</span>
            <span class="sb-ell" style="font-size: 13px; font-weight: 700">{{b.host}}</span>
          </div>
          <div style="width: 84px; flex-shrink: 0; background: {{accent}}; color: {{accentInk}}; border-left: 2px dashed rgba(42,38,32,0.45); display: flex; align-items: center; justify-content: center; padding-right: 10px; box-sizing: border-box">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="1.5"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path><path d="m9 15 2 2 4-4"></path></svg>
          </div>
        </a>
      </div>
    </sc-for>
  </div>

  <div style="padding: 34px 20px 0; font-size: 11px; letter-spacing: 1.6px; font-weight: 700; color: {{labelInk}}">BOOKING · LONG / UNKNOWN HOST · host truncates</div>
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <span style="padding: 0 6px; font-family: 'Caveat', cursive; font-size: 32px; font-weight: 700"><span style="background: {{highlight}}; padding: 0 6px">book a slot</span></span>
    <sc-for list="{{bookingLong}}" as="b" hint-placeholder-count="1">
      <div style="filter: drop-shadow(0 8px 12px rgba(0,0,0,0.14)); transform: rotate(1deg)">
        <a href="{{b.url}}" class="sb-ticket" style="display: flex; min-height: 104px; background-color: #FBF8F1; background-image: repeating-linear-gradient(180deg, transparent 0 19px, #C9DAEA 19px 20px); color: #2A2620">
          <div style="flex: 1 1 auto; min-width: 0; padding: 12px 12px 12px 28px; display: flex; flex-direction: column; justify-content: center; gap: 2px">
            <span style="font-size: 11px; letter-spacing: 2px; font-weight: 700; color: #5A5246">ADMIT ONE · BOOKING</span>
            <span style="font-family: 'Archivo Black', sans-serif; font-size: 23px; letter-spacing: -0.4px; line-height: 1.05">BOOK A SLOT</span>
            <span class="sb-ell" style="font-size: 13px; font-weight: 700">{{b.host}}</span>
          </div>
          <div style="width: 84px; flex-shrink: 0; background: {{accent}}; color: {{accentInk}}; border-left: 2px dashed rgba(42,38,32,0.45); display: flex; align-items: center; justify-content: center; padding-right: 10px; box-sizing: border-box">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="1.5"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path><path d="m9 15 2 2 4-4"></path></svg>
          </div>
        </a>
      </div>
    </sc-for>
  </div>

  <!-- ================= RESUME ================= -->
  <div style="padding: 44px 20px 0; font-size: 11px; letter-spacing: 1.6px; font-weight: 700; color: {{labelInk}}">RESUME · FULL · sits right before the contact note</div>
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <span style="padding: 0 6px; font-family: 'Caveat', cursive; font-size: 32px; font-weight: 700"><span style="background: {{highlight}}; padding: 0 6px">résumé</span></span>
    <sc-for list="{{resumeFull}}" as="r" hint-placeholder-count="1">
      <a href="{{r.fileUrl}}" download style="position: relative; display: flex; align-items: center; gap: 18px; padding: 20px 16px 20px 20px; background-color: #CFAE84; background-image: radial-gradient(rgba(90,60,30,0.18) 1px, transparent 1.5px); background-size: 6px 6px; color: #2A2016; box-shadow: 0 10px 20px rgba(0,0,0,0.14); transform: rotate(-1deg)">
        <div style="position: relative; width: 62px; height: 80px; flex-shrink: 0; box-sizing: border-box; padding: 16px 9px 0; background-color: #FFFFFF; background-image: repeating-linear-gradient(180deg, #CFC8BA 0 1.5px, transparent 1.5px 8px); background-clip: content-box; box-shadow: 0 6px 12px rgba(0,0,0,0.16); transform: rotate(-6deg)">
          <div style="position: absolute; left: 50%; top: -8px; width: 40px; height: 14px; margin-left: -20px; background: {{tape}}; opacity: 0.9; transform: rotate(4deg)"></div>
        </div>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
          <span style="font-family: 'Gloock', Georgia, serif; font-size: 21px; line-height: 1.12; overflow-wrap: anywhere">{{r.label}}</span>
          <span style="height: 44px; padding: 0 16px; background: #1B1A18; color: #F4F1EA; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: 1px; box-shadow: 0 4px 0 rgba(0,0,0,0.2)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
            DOWNLOAD
          </span>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="padding: 34px 20px 0; font-size: 11px; letter-spacing: 1.6px; font-weight: 700; color: {{labelInk}}">RESUME · SPARSE · no label, defaults to "Résumé / CV"</div>
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <span style="padding: 0 6px; font-family: 'Caveat', cursive; font-size: 32px; font-weight: 700"><span style="background: {{highlight}}; padding: 0 6px">résumé</span></span>
    <sc-for list="{{resumeSparse}}" as="r" hint-placeholder-count="1">
      <a href="{{r.fileUrl}}" download style="position: relative; display: flex; align-items: center; gap: 18px; padding: 20px 16px 20px 20px; background-color: #CFAE84; background-image: radial-gradient(rgba(90,60,30,0.18) 1px, transparent 1.5px); background-size: 6px 6px; color: #2A2016; box-shadow: 0 10px 20px rgba(0,0,0,0.14); transform: rotate(-1deg)">
        <div style="position: relative; width: 62px; height: 80px; flex-shrink: 0; box-sizing: border-box; padding: 16px 9px 0; background-color: #FFFFFF; background-image: repeating-linear-gradient(180deg, #CFC8BA 0 1.5px, transparent 1.5px 8px); background-clip: content-box; box-shadow: 0 6px 12px rgba(0,0,0,0.16); transform: rotate(-6deg)">
          <div style="position: absolute; left: 50%; top: -8px; width: 40px; height: 14px; margin-left: -20px; background: {{tape}}; opacity: 0.9; transform: rotate(4deg)"></div>
        </div>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
          <span style="font-family: 'Gloock', Georgia, serif; font-size: 21px; line-height: 1.12; overflow-wrap: anywhere">{{r.label}}</span>
          <span style="height: 44px; padding: 0 16px; background: #1B1A18; color: #F4F1EA; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: 1px; box-shadow: 0 4px 0 rgba(0,0,0,0.2)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
            DOWNLOAD
          </span>
        </div>
      </a>
    </sc-for>
  </div>

  <!-- ================= PORTFOLIO ================= -->
  <div style="padding: 44px 20px 0; font-size: 11px; letter-spacing: 1.6px; font-weight: 700; color: {{labelInk}}">PORTFOLIO · FULL (12) · sits after the photo dump</div>
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <span style="padding: 0 6px; font-family: 'Caveat', cursive; font-size: 32px; font-weight: 700"><span style="background: {{highlight}}; padding: 0 6px">things i made</span></span>
    <sc-for list="{{portfolioFull}}" as="p" hint-placeholder-count="12">
      <a href="{{p.url}}" style="position: relative; display: flex; align-items: flex-start; gap: 14px; min-height: 64px; padding: 14px; box-sizing: border-box; background-color: {{p.paper}}; background-image: {{p.pattern}}; color: #2A2620; box-shadow: 0 8px 16px rgba(0,0,0,0.12); transform: {{p.rot}}">
        <div style="position: absolute; left: 50%; top: -9px; width: 56px; height: 18px; margin-left: -28px; background: {{tape}}; opacity: 0.85; transform: {{p.tapeRot}}"></div>
        <sc-if value="{{p.hasThumb}}" hint-placeholder-val="{{ false }}">
          <div style="width: 76px; flex-shrink: 0; padding: 5px 5px 14px; box-sizing: border-box; background: #FFFFFF; box-shadow: 0 4px 10px rgba(0,0,0,0.14); transform: rotate(-3deg)">
            <img src="{{p.thumbUrl}}" alt="" style="display: block; width: 100%; aspect-ratio: 1; object-fit: cover; object-position: 50% 18%">
          </div>
        </sc-if>
        <sc-if value="{{p.noThumb}}" hint-placeholder-val="{{ true }}">
          <span style="width: 52px; height: 58px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: {{p.letterBg}}; color: {{p.letterInk}}; font-family: {{p.letterFont}}; font-size: 34px; line-height: 1; transform: {{p.letterRot}}; box-shadow: 0 3px 0 rgba(0,0,0,0.14)">{{p.initial}}</span>
